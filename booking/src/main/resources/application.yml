server:
  port: 8082

spring:
  application:
    name: booking

  # Owns booking-db. Credentials come from env vars (never hard-coded), with local-dev defaults
  # after the ':'. Compose (1.4) overrides the URL/host via env.
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${BOOKING_DB_USER:postgres}
    password: ${BOOKING_DB_PASSWORD:postgres}

  # Liquibase owns the schema; Hibernate only VALIDATEs entities against it on boot.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# A Eureka CLIENT: registers with the discovery server on startup.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
