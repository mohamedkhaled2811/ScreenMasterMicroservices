server:
  port: 8082

spring:
  application:
    name: booking

  # Owns booking-db. Credentials come from env vars (never hard-coded), with local-dev defaults
  # after the ':'. Compose (1.4) overrides the URL/host via env.
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${BOOKING_DB_USER:postgres}
    password: ${BOOKING_DB_PASSWORD:postgres}

  # Liquibase owns the schema; Hibernate only VALIDATEs entities against it on boot.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# OpenAPI / Swagger UI (see docs/concepts/openapi-springdoc.md). Spec at /v3/api-docs, UI at
# /swagger-ui.html; the gateway aggregates every service's spec into one UI at :8080. Emit OpenAPI
# 3.1; the gateway base for "Try it out" is externalised so Compose can override the public host.
springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
openapi:
  public-url: ${OPENAPI_PUBLIC_URL:http://localhost:8080}

# A Eureka CLIENT: registers with the discovery server on startup.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
