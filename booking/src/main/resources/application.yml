server:
  port: 8082

spring:
  application:
    name: booking

  # Owns booking-db. Credentials come from env vars (never hard-coded), with local-dev defaults
  # after the ':'. Compose (1.4) overrides the URL/host via env.
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${BOOKING_DB_USER:postgres}
    password: ${BOOKING_DB_PASSWORD:postgres}

  # Liquibase owns the schema; Hibernate only VALIDATEs entities against it on boot.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # RabbitMQ — Booking CONSUMES MovieUpserted here into its movie_projections read model (CQRS, BUILD_PLAN
  # 2.3). Host defaults to localhost for `mvn spring-boot:run`; Compose overrides RABBITMQ_HOST to the
  # `rabbitmq` container.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# OpenAPI / Swagger UI (see docs/concepts/openapi-springdoc.md). Spec at /v3/api-docs, UI at
# /swagger-ui.html; the gateway aggregates every service's spec into one UI at :8080. Emit OpenAPI
# 3.1; the gateway base for "Try it out" is externalised so Compose can override the public host.
springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
openapi:
  public-url: ${OPENAPI_PUBLIC_URL:http://localhost:8080}

# Hold-expiry sweeper (BUILD_PLAN 3.4): how often the tick scans for PENDING bookings past
# their hold. A missed hold simply waits for the next tick — cadence is a freshness knob, not a
# correctness one, because the confirm's conditional update guards the race either way.
booking:
  expiry:
    sweep-interval-millis: ${BOOKING_EXPIRY_SWEEP_INTERVAL_MILLIS:60000}

  # Transactional-outbox relay (BUILD_PLAN 4.1/4.2): how often the drain tick runs and how many rows
  # one tick claims. Short enough that a confirmed booking feels instant; bounded so the first tick
  # after an outage walks the backlog over several passes. Mirrors payment's payment.outbox block.
  outbox:
    relay-interval-millis: ${BOOKING_OUTBOX_RELAY_INTERVAL_MILLIS:2000}
    relay-batch-size: ${BOOKING_OUTBOX_RELAY_BATCH_SIZE:50}

# A Eureka CLIENT: registers with the discovery server on startup.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

# Distributed tracing (Phase 6, decision E1): sample 100% in the lab so every demo request appears
# in Zipkin. Production runs ~0.1 (10%) — recording every trace is expensive (CPU + span storage),
# and the decision is made once at the first service and carried in the traceparent flag. The
# endpoint defaults to the local Zipkin; Compose points it at the `zipkin` container via ZIPKIN_ENDPOINT.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    # Boot 4 renamed this key: it is `management.tracing.export.zipkin.endpoint`, NOT the Boot 3
    # `management.zipkin.tracing.endpoint`. The old key binds to nothing and the sender silently
    # keeps its built-in default of http://localhost:9411 — which inside a container is the
    # container itself, so every export fails with ConnectException while the network is fine.
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
