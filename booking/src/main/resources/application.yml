server:
  port: 8082

spring:
  application:
    name: booking

  # Own booking-db; credentials from env vars with local-dev defaults.
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${BOOKING_DB_USER:postgres}
    password: ${BOOKING_DB_PASSWORD:postgres}

  # Liquibase owns the schema; Hibernate only validates entities against it.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # RabbitMQ; host overridden by Compose.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # OAuth2 resource server; one issuer URI feeds both the iss check and the JWKS URL.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/cinema}

# OpenAPI spec at /v3/api-docs, UI at /swagger-ui.html; gateway aggregates all specs.
springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
openapi:
  public-url: ${OPENAPI_PUBLIC_URL:http://localhost:8080}

# Hold-expiry sweeper cadence; a missed hold waits for the next tick.
booking:
  expiry:
    sweep-interval-millis: ${BOOKING_EXPIRY_SWEEP_INTERVAL_MILLIS:60000}

  # Outbox relay cadence and per-tick batch size.
  outbox:
    relay-interval-millis: ${BOOKING_OUTBOX_RELAY_INTERVAL_MILLIS:2000}
    relay-batch-size: ${BOOKING_OUTBOX_RELAY_BATCH_SIZE:50}

# Eureka client registration.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

# Tracing; 100% sampling for the lab. Endpoint overridden by Compose.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
