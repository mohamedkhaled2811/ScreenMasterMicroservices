# Changeset 001 — inventory tables: theaters -> screens -> seats + seat_types (all FKs intra-database).
# PKs are generated (IDENTITY); entities must match these tables exactly (ddl-auto=validate).
databaseChangeLog:
  - changeSet:
      id: 001-create-theaters
      author: mohamed
      changes:
        - createTable:
            tableName: theaters
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # Theater name is unique.
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_theaters_name
              - column:
                  name: location
                  type: VARCHAR(255)
              # Auditing timestamps, filled by JPA auditing.
              - column:
                  name: created_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 001-create-seat-types
      author: mohamed
      changes:
        - createTable:
            # Lookup: STANDARD/PREMIUM/VIP with a price multiplier.
            tableName: seat_types
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_seat_types_name
              # total = showtime.base_price * price_multiplier.
              - column:
                  name: price_multiplier
                  type: NUMERIC(4, 2)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 001-create-screens
      author: mohamed
      changes:
        - createTable:
            tableName: screens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              # ScreenType enum stored as STRING.
              - column:
                  name: screen_type
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: theater_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITH TIME ZONE
        # Screen name is unique within a theater.
        - addUniqueConstraint:
            tableName: screens
            columnNames: name, theater_id
            constraintName: uq_screens_name_theater
        - addForeignKeyConstraint:
            constraintName: fk_screens_theater
            baseTableName: screens
            baseColumnNames: theater_id
            referencedTableName: theaters
            referencedColumnNames: id

  - changeSet:
      id: 001-create-seats
      author: mohamed
      changes:
        - createTable:
            tableName: seats
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # Grid position: row label + number within the row.
              - column:
                  name: seat_row
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: seat_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: screen_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: seat_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITH TIME ZONE
        # (screen, row, number) is unique — the identity a booking reserves against.
        - addUniqueConstraint:
            tableName: seats
            columnNames: screen_id, seat_row, seat_number
            constraintName: uq_seats_screen_row_number
        - addForeignKeyConstraint:
            constraintName: fk_seats_screen
            baseTableName: seats
            baseColumnNames: screen_id
            referencedTableName: screens
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_seats_seat_type
            baseTableName: seats
            baseColumnNames: seat_type_id
            referencedTableName: seat_types
            referencedColumnNames: id
