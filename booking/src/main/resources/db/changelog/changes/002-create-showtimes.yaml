# Changeset 002 — showtimes. movie_id is a plain indexed column (no FK); screen_id is a real FK.
databaseChangeLog:
  - changeSet:
      id: 002-create-showtimes
      author: mohamed
      changes:
        - createTable:
            tableName: showtimes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # Cross-service reference to Catalog's movie (no FK); indexed below.
              - column:
                  name: movie_id
                  type: BIGINT
                  constraints:
                    nullable: false
              # Intra-database reference to screens (real FK below).
              - column:
                  name: screen_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: show_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: show_time
                  type: TIME
                  constraints:
                    nullable: false
              # Per-seat price = base_price * seat_type.price_multiplier.
              - column:
                  name: base_price
                  type: NUMERIC(10, 2)
                  constraints:
                    nullable: false
              # ShowtimeStatus enum stored as STRING.
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITH TIME ZONE
        # One movie can't occupy the same screen at the same date+time twice.
        - addUniqueConstraint:
            tableName: showtimes
            columnNames: screen_id, movie_id, show_date, show_time
            constraintName: uq_showtimes_slot
        - addForeignKeyConstraint:
            constraintName: fk_showtimes_screen
            baseTableName: showtimes
            baseColumnNames: screen_id
            referencedTableName: screens
            referencedColumnNames: id
        # Index (not FK) for "showtimes for movie X".
        - createIndex:
            indexName: idx_showtimes_movie_id
            tableName: showtimes
            columns:
              - column:
                  name: movie_id
