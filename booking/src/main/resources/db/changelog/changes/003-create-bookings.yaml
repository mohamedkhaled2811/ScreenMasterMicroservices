# Changeset 003 — bookings + booking_seats. Snapshot columns freeze price facts at booking time.
# Enum columns are VARCHAR (stored as STRING).
databaseChangeLog:
  - changeSet:
      id: 003-create-bookings
      author: mohamed
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              # Human-facing handle; unique per booking.
              - column:
                  name: booking_reference
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_bookings_reference
              # Owner user id (no FK — owned by Identity).
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              # Referenced showtime (plain column here; FK added in 007).
              - column:
                  name: showtime_id
                  type: BIGINT
                  constraints:
                    nullable: false
              # BookingStatus as STRING.
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              # PaymentStatus as STRING.
              - column:
                  name: payment_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              # Frozen total at booking time.
              - column:
                  name: total_amount
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              # Hold deadline; the expiry sweeper frees seats past this.
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 003-create-booking-seats
      author: mohamed
      changes:
        - createTable:
            tableName: booking_seats
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: booking_id
                  type: BIGINT
                  constraints:
                    nullable: false
              # Reserved seat (intra-database reference).
              - column:
                  name: seat_id
                  type: BIGINT
                  constraints:
                    nullable: false
              # Frozen price and seat-type name at booking time.
              - column:
                  name: seat_price
                  type: NUMERIC(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: seat_type_name
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
        # A seat appears at most once per booking.
        - addUniqueConstraint:
            tableName: booking_seats
            columnNames: booking_id, seat_id
            constraintName: uq_booking_seats_booking_seat
        - addForeignKeyConstraint:
            constraintName: fk_booking_seats_booking
            baseTableName: booking_seats
            baseColumnNames: booking_id
            referencedTableName: bookings
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_booking_seats_seat
            baseTableName: booking_seats
            baseColumnNames: seat_id
            referencedTableName: seats
            referencedColumnNames: id
