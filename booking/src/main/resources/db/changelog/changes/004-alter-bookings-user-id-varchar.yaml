# Changeset 004 — bookings.user_id BIGINT -> VARCHAR(36) (Keycloak sub is a UUID string).
# New changeset (shipped changesets are immutable); table is still empty so no back-fill needed.
databaseChangeLog:
  - changeSet:
      id: 004-alter-bookings-user-id-varchar
      author: mohamed
      changes:
        - modifyDataType:
            tableName: bookings
            columnName: user_id
            newDataType: VARCHAR(36)
        # Re-assert NOT NULL (modifyDataType does not carry it on every database).
        - addNotNullConstraint:
            tableName: bookings
            columnName: user_id
            columnDataType: VARCHAR(36)
