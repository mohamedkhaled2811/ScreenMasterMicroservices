# Changeset 005 — movie_titles: local cache of Catalog movie id -> title.
# updated_at carries the source row timestamp for the ordering guard; null means backfilled by fetch.
databaseChangeLog:
  - changeSet:
      id: 005-create-movie-titles
      author: mohamed
      changes:
        - createTable:
            tableName: movie_titles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_movie_titles
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
