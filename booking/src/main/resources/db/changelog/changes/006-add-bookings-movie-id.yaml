# Changeset 006 — bookings.movie_id snapshot (plain indexed column, no FK).
# New changeset (shipped changesets are immutable); table is still empty so no back-fill needed.
databaseChangeLog:
  - changeSet:
      id: 006-add-bookings-movie-id
      author: mohamed
      changes:
        - addColumn:
            tableName: bookings
            columns:
              - column:
                  name: movie_id
                  type: BIGINT
                  constraints:
                    nullable: false
        # Index for "all bookings for movie X".
        - createIndex:
            indexName: idx_bookings_movie_id
            tableName: bookings
            columns:
              - column:
                  name: movie_id
