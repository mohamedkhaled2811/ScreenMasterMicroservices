# Changeset 007 — bookings.showtime_id becomes a real FK (ON DELETE NO ACTION).
databaseChangeLog:
  - changeSet:
      id: 007-add-bookings-showtime-fk
      author: mohamed
      changes:
        - addForeignKeyConstraint:
            constraintName: fk_bookings_showtime
            baseTableName: bookings
            baseColumnNames: showtime_id
            referencedTableName: showtimes
            referencedColumnNames: id
        # Index for the double-booking guard and "bookings for showtime" reads.
        - createIndex:
            indexName: idx_bookings_showtime_id
            tableName: bookings
            columns:
              - column:
                  name: showtime_id
