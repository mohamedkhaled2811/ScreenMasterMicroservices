# Changeset 008 — rename movie_titles to movie_projections (forward-only; 005 stays immutable).
# Safe as a plain rename: this table is private to Booking.
databaseChangeLog:
  - changeSet:
      id: 008-rename-movie-titles
      author: mohamed
      changes:
        - renameTable:
            oldTableName: movie_titles
            newTableName: movie_projections
        - dropPrimaryKey:
            tableName: movie_projections
            constraintName: pk_movie_titles
        - addPrimaryKey:
            tableName: movie_projections
            columnNames: id
            constraintName: pk_movie_projections
