# Changeset 009 — explicit currency: one column on theaters (inherited), snapshotted on bookings.
# Existing rows backfill to EGP before the NOT NULL constraint.
databaseChangeLog:

  - changeSet:
      id: 009-1-add-theaters-currency
      author: mohamed
      comment: A theater bills in exactly one currency; everything under it inherits.
      changes:
        - addColumn:
            tableName: theaters
            columns:
              - column:
                  name: currency
                  type: VARCHAR(3)
                  remarks: ISO 4217. The currency every price under this theater is denominated in.
        # Backfill before NOT NULL, or the constraint fails on existing rows.
        - update:
            tableName: theaters
            columns:
              - column: { name: currency, value: EGP }
            where: currency IS NULL
        - addNotNullConstraint:
            tableName: theaters
            columnName: currency
            columnDataType: VARCHAR(3)

  - changeSet:
      id: 009-2-add-bookings-currency
      author: mohamed
      comment: Snapshot of the theater's currency at booking time — frozen with the price.
      changes:
        - addColumn:
            tableName: bookings
            columns:
              - column:
                  name: currency
                  type: VARCHAR(3)
                  remarks: Snapshotted from the theater. Never recomputed — the charge must not drift.
        - update:
            tableName: bookings
            columns:
              - column: { name: currency, value: EGP }
            where: currency IS NULL
        - addNotNullConstraint:
            tableName: bookings
            columnName: currency
            columnDataType: VARCHAR(3)
