# Changeset 009 — currency becomes explicit (BUILD_PLAN Phase 3.1).
#
# Until now an amount was a bare number with no currency anywhere in the system, which was survivable
# only while every price was implicitly the same one. Real payment gateways make that impossible:
# Paymob settles EGP, Stripe test mode settles USD, and the amount sent to a gateway must be
# accompanied by the currency it is denominated in.
#
# WHERE the currency lives: on the THEATER. A theater sits in one country and bills in one currency,
# so every screen, showtime and seat under it inherits — one column, no per-row duplication, and no
# way for two seats in the same room to disagree. A booking then SNAPSHOTS it, exactly like it already
# snapshots the per-seat price and the movie id: the charge must never move because someone edited a
# theater afterwards.
#
# Existing rows are backfilled to EGP (the scenario's currency) and only then made NOT NULL, so this
# is safe to apply to a database with data in it.
databaseChangeLog:

  - changeSet:
      id: 009-1-add-theaters-currency
      author: mohamed
      comment: A theater bills in exactly one currency; everything under it inherits.
      changes:
        - addColumn:
            tableName: theaters
            columns:
              - column:
                  name: currency
                  type: VARCHAR(3)
                  remarks: ISO 4217. The currency every price under this theater is denominated in.
        # Backfill BEFORE the NOT NULL, or the constraint fails on existing rows.
        - update:
            tableName: theaters
            columns:
              - column: { name: currency, value: EGP }
            where: currency IS NULL
        - addNotNullConstraint:
            tableName: theaters
            columnName: currency
            columnDataType: VARCHAR(3)

  - changeSet:
      id: 009-2-add-bookings-currency
      author: mohamed
      comment: Snapshot of the theater's currency at booking time — frozen with the price.
      changes:
        - addColumn:
            tableName: bookings
            columns:
              - column:
                  name: currency
                  type: VARCHAR(3)
                  remarks: Snapshotted from the theater. Never recomputed — the charge must not drift.
        - update:
            tableName: bookings
            columns:
              - column: { name: currency, value: EGP }
            where: currency IS NULL
        - addNotNullConstraint:
            tableName: bookings
            columnName: currency
            columnDataType: VARCHAR(3)
