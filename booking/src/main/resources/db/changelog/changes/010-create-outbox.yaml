# Changeset 010 — transactional outbox table; a scheduled relay publishes pending rows.
# payload is TEXT; aggregate_id is a logical ref with no FK; partial index covers the pending drain.
databaseChangeLog:
  - changeSet:
      id: 010-1-create-outbox
      author: mohamed
      changes:
        - createTable:
            tableName: outbox
            remarks: Transactional outbox. Rows written with the business change; relay publishes them.
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: event_type
                  type: VARCHAR(60)
                  remarks: BOOKING_CONFIRMED | BOOKING_CONFIRMATION_REJECTED
                  constraints: { nullable: false }
              - column:
                  name: aggregate_id
                  type: BIGINT
                  remarks: bookings.id — logical ref, deliberately no FK.
                  constraints: { nullable: false }
              - column:
                  name: routing_key
                  type: VARCHAR(120)
                  remarks: Topic routing key, e.g. booking-confirmed-key — the contract consumers bind to.
                  constraints: { nullable: false }
              - column:
                  name: payload
                  type: TEXT
                  remarks: The event JSON exactly as it must travel on the wire.
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: NULL = pending. Set by the relay AFTER the broker accepts the event.
        # Partial index for the relay's WHERE published_at IS NULL ORDER BY id drain.
        - createIndex:
            indexName: idx_outbox_pending
            tableName: outbox
            columns:
              - column: { name: published_at }
              - column: { name: id }
