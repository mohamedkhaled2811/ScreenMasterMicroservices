# Changeset 011 — trace context on outbox rows so the relay can stamp a traceparent header.
# Both columns nullable: rows without a trace publish without the header.
databaseChangeLog:
  - changeSet:
      id: 011-1-add-outbox-trace-context
      author: mohamed
      changes:
        - addColumn:
            tableName: outbox
            columns:
              - column:
                  name: trace_id
                  type: VARCHAR(32)
                  remarks: The 32-hex W3C trace id active when the row was written (null when none was).
              - column:
                  name: span_id
                  type: VARCHAR(16)
                  remarks: The 16-hex id of the writing span - the consumer's restored span is its child.
