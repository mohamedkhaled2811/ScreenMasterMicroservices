# Changeset 012 — movie_projections.poster_path (nullable; some titles have no artwork).
databaseChangeLog:
  - changeSet:
      id: 012-add-movie-projection-poster
      author: mohamed
      changes:
        - addColumn:
            tableName: movie_projections
            columns:
              - column:
                  name: poster_path
                  type: varchar(255)
                  constraints:
                    nullable: true
