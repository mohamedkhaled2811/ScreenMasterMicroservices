# Liquibase master changelog for booking-db. Changesets apply in listed order; shipped files are immutable.
#
#   001-create-inventory   theaters -> screens -> seats + seat_types
#   002-create-showtimes   showtimes; movie_id is a plain column (no FK), screen_id is a real FK
#   003-create-bookings    bookings + booking_seats
#   004-alter-bookings-...  bookings.user_id BIGINT -> VARCHAR(36)
#   005-create-movie-titles local movie title cache (id -> title)
#   006-add-bookings-...    bookings.movie_id snapshot (no FK)
#   007-add-bookings-...    bookings.showtime_id FK
#   008-rename-movie-...   movie_titles -> movie_projections
#   010-create-outbox      transactional outbox table
#   011-add-outbox-trace-  outbox trace_id + span_id columns
#     context
#   012-add-movie-projec-  movie_projections.poster_path
#     tion-poster
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-inventory.yaml
  - include:
      file: db/changelog/changes/002-create-showtimes.yaml
  - include:
      file: db/changelog/changes/003-create-bookings.yaml
  - include:
      file: db/changelog/changes/004-alter-bookings-user-id-varchar.yaml
  - include:
      file: db/changelog/changes/005-create-movie-titles.yaml
  - include:
      file: db/changelog/changes/006-add-bookings-movie-id.yaml
  - include:
      file: db/changelog/changes/007-add-bookings-showtime-fk.yaml
  - include:
      file: db/changelog/changes/008-rename-movie-titles.yaml
  - include:
      file: db/changelog/changes/009-add-currency.yaml
  - include:
      file: db/changelog/changes/010-create-outbox.yaml
  - include:
      file: db/changelog/changes/011-add-outbox-trace-context.yaml
  - include:
      file: db/changelog/changes/012-add-movie-projection-poster.yaml
