# Liquibase master changelog for the booking service (booking-db).
#
# Booking absorbs the monolith's Theater + Scheduling contexts (schema doc §8.1), so its schema is the
# inventory tree, showtimes, and its own bookings — all in one private database. Changesets are applied
# in listed order; each `include`d file is immutable once shipped (new changes go in a NEW file).
#
#   001-create-inventory   theaters -> screens -> seats + seat_types (intra-Booking FKs)
#   002-create-showtimes   showtimes; movie_id is the cross-service CUT (no FK), screen_id is a real FK
#   003-create-bookings    bookings + booking_seats — schema first (mapped as entities in Phase 2 part 2)
#   004-alter-bookings-...  widen bookings.user_id BIGINT -> VARCHAR(36) (Keycloak `sub` is a UUID string)
#   005-create-movie-titles Booking's local read model of Catalog movie titles (CQRS way B, BUILD_PLAN 2.3)
#   006-add-bookings-...    bookings.movie_id — the Catalog ref snapshotted from the showtime (no FK)
#   007-add-bookings-...    bookings.showtime_id FK constraint (intra-Booking, both sides local)
#   008-rename-movie-...   movie_titles -> movie_projections; the projection is the concept, title is
#                           one column on it. Booking-private table, so a plain forward-only rename.
#   010-create-outbox      outbox — transactional outbox: saga events written atomically with the
#                           booking write; the Phase-4 relay publishes them (BUILD_PLAN 4.1/4.2)
#   011-add-outbox-trace-  outbox.trace_id + span_id — the originating trace, persisted so the
#     context              async relay can carry it across the commit boundary
#
# See docs/concepts/liquibase.md.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-inventory.yaml
  - include:
      file: db/changelog/changes/002-create-showtimes.yaml
  - include:
      file: db/changelog/changes/003-create-bookings.yaml
  - include:
      file: db/changelog/changes/004-alter-bookings-user-id-varchar.yaml
  - include:
      file: db/changelog/changes/005-create-movie-titles.yaml
  - include:
      file: db/changelog/changes/006-add-bookings-movie-id.yaml
  - include:
      file: db/changelog/changes/007-add-bookings-showtime-fk.yaml
  - include:
      file: db/changelog/changes/008-rename-movie-titles.yaml
  - include:
      file: db/changelog/changes/009-add-currency.yaml
  - include:
      file: db/changelog/changes/010-create-outbox.yaml
  - include:
      file: db/changelog/changes/011-add-outbox-trace-context.yaml
