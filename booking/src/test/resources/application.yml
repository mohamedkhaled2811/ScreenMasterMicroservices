# Test-only config: H2 in-memory database, Liquibase off, Eureka off.
spring:
  datasource:
    url: jdbc:h2:mem:booking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
  # Repeats the main issuer URI (test resources shadow main-only keys); no network at boot.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/cinema

eureka:
  client:
    enabled: false
