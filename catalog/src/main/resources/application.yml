server:
  port: 8081

spring:
  application:
    name: catalog

  # Owns catalog-db. Credentials come from env vars (never hard-coded), with local-dev defaults
  # after the ':'. Compose (1.4) overrides the URL/host via env.
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USER:postgres}
    password: ${CATALOG_DB_PASSWORD:postgres}

  # Liquibase owns the schema; Hibernate only VALIDATEs entities against it on boot.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# TMDB sync config (bound to TmdbProps). The access token is TMDB's v4 "API Read Access Token",
# sent as a Bearer header — supplied via the TMDB_API_KEY env var / .env, never committed. The sync
# walks all three movie lists, up to 10 pages per hourly tick (our own back-pressure vs TMDB's rate
# limit); enabled by default for local/compose, disabled in the test profile so tests stay hermetic.
tmdb:
  access-token: ${TMDB_API_KEY:}
  base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
  image-base-url: ${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}
  enabled: ${TMDB_SYNC_ENABLED:true}
  cron: ${TMDB_SYNC_CRON:0 */20 * * * *}
  max-pages-per-run: ${TMDB_MAX_PAGES_PER_RUN:10}

# A Eureka CLIENT: registers with the discovery server on startup.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
