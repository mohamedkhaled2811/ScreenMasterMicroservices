server:
  port: 8081

spring:
  application:
    name: catalog

  # Owns catalog-db. Credentials come from env vars (never hard-coded), with local-dev defaults
  # after the ':'. Compose (1.4) overrides the URL/host via env.
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USER:postgres}
    password: ${CATALOG_DB_PASSWORD:postgres}

  # Liquibase owns the schema; Hibernate only VALIDATEs entities against it on boot.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # RabbitMQ — Catalog PUBLISHES MovieUpserted here (CQRS read model, BUILD_PLAN 2.3). Host defaults to
  # localhost for `mvn spring-boot:run`; Compose overrides RABBITMQ_HOST to the `rabbitmq` container.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# TMDB sync config (bound to TmdbProps). The access token is TMDB's v4 "API Read Access Token",
# sent as a Bearer header — supplied via the TMDB_API_KEY env var / .env, never committed. The sync
# walks all three movie lists, up to 10 pages per hourly tick (our own back-pressure vs TMDB's rate
# limit); enabled by default for local/compose, disabled in the test profile so tests stay hermetic.
tmdb:
  access-token: ${TMDB_API_KEY:}
  base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
  image-base-url: ${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}
  enabled: ${TMDB_SYNC_ENABLED:true}
  cron: ${TMDB_SYNC_CRON:0 */20 * * * *}
  max-pages-per-run: ${TMDB_MAX_PAGES_PER_RUN:10}

# OpenAPI / Swagger UI (see docs/concepts/openapi-springdoc.md). Spec at /v3/api-docs, UI at
# /swagger-ui.html; the gateway aggregates every service's spec into one UI at :8080. Emit OpenAPI
# 3.1; the gateway base for "Try it out" is externalised so Compose can override the public host.
springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
openapi:
  public-url: ${OPENAPI_PUBLIC_URL:http://localhost:8080}

# A Eureka CLIENT: registers with the discovery server on startup.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

# Distributed tracing: sample 100% in the lab so every demo request appears
# in Zipkin. Production runs ~0.1 (10%) — recording every trace is expensive (CPU + span storage),
# and the sampling decision is made once at the first service and carried in the traceparent flag. The
# endpoint defaults to the local Zipkin; Compose points it at the `zipkin` container via ZIPKIN_ENDPOINT.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    # Boot 4 renamed this key: it is `management.tracing.export.zipkin.endpoint`, NOT the Boot 3
    # `management.zipkin.tracing.endpoint`. The old key binds to nothing and the sender silently
    # keeps its built-in default of http://localhost:9411 — which inside a container is the
    # container itself, so every export fails with ConnectException while the network is fine.
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
