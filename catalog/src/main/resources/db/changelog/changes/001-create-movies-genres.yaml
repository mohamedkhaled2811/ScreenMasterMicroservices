# Changeset 001 — the catalog's movies/genres schema.
#
# Catalog owns this slice outright (database-per-service), so the three tables and the FKs between
# them live wholly inside catalog-db — the "no cross-service FK" rule is about FKs that cross a
# SERVICE boundary, not these. The PKs are ASSIGNED (TMDB's ids), not generated: the id is stable and
# externally sourced, which is exactly why §2.1 of the schema doc flags Catalog as a clean boundary.
#
# The columns mirror TMDB's GET /movie/{id} (movie-details) response 1:1 so the Phase-2 sync job can
# fill them with no further migration. ddl-auto=validate means the Movie/Genre entities must match
# this table exactly at startup, or the app refuses to boot.
#
# NOTE: the monolith's table was misspelled `geners`; we own the boundary now, so it is `genres` here
# (schema doc §9 cleanup). The table ships EMPTY — rows are loaded by the TMDB sync step (next phase).
databaseChangeLog:
  - changeSet:
      id: 001-create-genres
      author: mohamed
      changes:
        - createTable:
            tableName: genres
            columns:
              # Assigned TMDB genre id — no autoIncrement.
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_genres_name

  - changeSet:
      id: 001-create-movies
      author: mohamed
      changes:
        - createTable:
            tableName: movies
            columns:
              # Assigned TMDB movie id — no autoIncrement.
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: original_title
                  type: VARCHAR(500)
              - column:
                  name: overview
                  type: TEXT
              # TMDB's short promotional one-liner (distinct from the plot `overview`); often empty
              # upstream, so nullable.
              - column:
                  name: tagline
                  type: VARCHAR(1000)
              - column:
                  name: release_date
                  type: DATE
              - column:
                  name: runtime
                  type: INT
              # TMDB free-text status (Released, Post Production, ...) — a plain VARCHAR, NOT a JPA
              # enum, so an unexpected upstream value can't break persistence.
              - column:
                  name: status
                  type: VARCHAR(40)
              - column:
                  name: original_language
                  type: VARCHAR(10)
              - column:
                  name: popularity
                  type: NUMERIC(10, 3)
              - column:
                  name: vote_average
                  type: NUMERIC(4, 2)
              - column:
                  name: vote_count
                  type: INT
              - column:
                  name: poster_path
                  type: VARCHAR(255)
              - column:
                  name: backdrop_path
                  type: VARCHAR(255)
              - column:
                  name: adult
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # Our auditing (BaseEntity-style), filled by Spring Data JPA auditing, not TMDB.
              - column:
                  name: created_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 001-create-movie-genres
      author: mohamed
      changes:
        - createTable:
            # Join table for Movie <-> Genre (@ManyToMany). Composite PK (movie_id, genre_id) makes a
            # movie/genre pairing unique; both columns FK into the intra-Catalog tables above.
            tableName: movie_genres
            columns:
              - column:
                  name: movie_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: genre_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: movie_genres
            columnNames: movie_id, genre_id
            constraintName: pk_movie_genres
        - addForeignKeyConstraint:
            constraintName: fk_movie_genres_movie
            baseTableName: movie_genres
            baseColumnNames: movie_id
            referencedTableName: movies
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_movie_genres_genre
            baseTableName: movie_genres
            baseColumnNames: genre_id
            referencedTableName: genres
            referencedColumnNames: id
