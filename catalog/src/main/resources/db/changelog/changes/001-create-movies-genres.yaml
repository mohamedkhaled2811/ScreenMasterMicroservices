# Changeset 001 — movies/genres schema.
#
# PKs are assigned TMDB ids, not generated.
#
# The table ships EMPTY — rows are loaded by the TMDB sync.
databaseChangeLog:
  - changeSet:
      id: 001-create-genres
      author: mohamed
      changes:
        - createTable:
            tableName: genres
            columns:
              # Assigned TMDB genre id — no autoIncrement.
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_genres_name

  - changeSet:
      id: 001-create-movies
      author: mohamed
      changes:
        - createTable:
            tableName: movies
            columns:
              # Assigned TMDB movie id — no autoIncrement.
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: original_title
                  type: VARCHAR(500)
              - column:
                  name: overview
                  type: TEXT
              # TMDB short tagline; often empty upstream, so nullable.
              - column:
                  name: tagline
                  type: VARCHAR(1000)
              - column:
                  name: release_date
                  type: DATE
              - column:
                  name: runtime
                  type: INT
              # Free-text status (Released, Post Production, ...) — plain VARCHAR, not an enum.
              - column:
                  name: status
                  type: VARCHAR(40)
              - column:
                  name: original_language
                  type: VARCHAR(10)
              - column:
                  name: popularity
                  type: NUMERIC(10, 3)
              - column:
                  name: vote_average
                  type: NUMERIC(4, 2)
              - column:
                  name: vote_count
                  type: INT
              - column:
                  name: poster_path
                  type: VARCHAR(255)
              - column:
                  name: backdrop_path
                  type: VARCHAR(255)
              - column:
                  name: adult
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              # Auditing fields, filled by JPA auditing.
              - column:
                  name: created_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: TIMESTAMP WITH TIME ZONE

  - changeSet:
      id: 001-create-movie-genres
      author: mohamed
      changes:
        - createTable:
            # Join table for Movie <-> Genre. Composite PK keeps pairings unique.
            tableName: movie_genres
            columns:
              - column:
                  name: movie_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: genre_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: movie_genres
            columnNames: movie_id, genre_id
            constraintName: pk_movie_genres
        - addForeignKeyConstraint:
            constraintName: fk_movie_genres_movie
            baseTableName: movie_genres
            baseColumnNames: movie_id
            referencedTableName: movies
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_movie_genres_genre
            baseTableName: movie_genres
            baseColumnNames: genre_id
            referencedTableName: genres
            referencedColumnNames: id
