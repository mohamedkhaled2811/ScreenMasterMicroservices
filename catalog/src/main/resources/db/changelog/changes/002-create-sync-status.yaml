# Changeset 002 — TMDB sync bookkeeping table. One row per SyncType.
#
# state and sync_type are stored as STRINGs, never ordinals.
databaseChangeLog:
  - changeSet:
      id: 002-create-sync-status
      author: mohamed
      changes:
        - createTable:
            tableName: sync_status
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_sync_status
                    nullable: false
              # The TMDB list this row tracks. Unique: exactly one bookkeeping row per type.
              - column:
                  name: sync_type
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_sync_status_sync_type
              # Last synced page (0 = nothing yet).
              - column:
                  name: last_page
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              # Total pages reported (0 until known).
              - column:
                  name: total_pages
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              # RUNNING / COMPLETED / FAILED.
              - column:
                  name: state
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              # Set when state=FAILED.
              - column:
                  name: error_message
                  type: VARCHAR(1000)
              # Last run timestamp.
              - column:
                  name: last_synced_at
                  type: TIMESTAMP WITH TIME ZONE
