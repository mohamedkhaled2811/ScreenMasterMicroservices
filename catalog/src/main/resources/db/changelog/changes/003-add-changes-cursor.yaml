# Changeset 003 — incremental-refresh cursor column on sync_status.
#
# Nullable: null = no refresh has run yet. Only the CHANGES row uses it.
databaseChangeLog:
  - changeSet:
      id: 003-add-changes-cursor
      author: mohamed
      changes:
        - addColumn:
            tableName: sync_status
            columns:
              # UTC day the refresh has caught up through; null until the first refresh.
              - column:
                  name: last_changes_synced_date
                  type: DATE
