# Test-only config — keeps the contextLoads smoke test hermetic (no Postgres, no Eureka).
spring:
  datasource:
    url: jdbc:h2:mem:catalog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false

eureka:
  client:
    enabled: false

# Keep tests hermetic: no scheduled TMDB calls, but give the props valid (dummy) values so the
# RestClient bean and TmdbProps still wire up in a full-context test.
tmdb:
  enabled: false
  changes-enabled: false
  access-token: test-token
