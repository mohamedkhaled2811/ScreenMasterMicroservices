# Test-only config — keeps the contextLoads smoke test hermetic (no Postgres, no Eureka).
spring:
  datasource:
    url: jdbc:h2:mem:catalog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
  # Phase 7: the test file SHADOWS the main application.yml (same precedent as payment's test
  # yml repeating the autoconfigure exclusion), so the resource-server issuer URI is repeated here.
  # The value only feeds the lazy JwtDecoder bean definition (no network at boot) and the
  # converter — hermetic tests never call Keycloak.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/cinema

eureka:
  client:
    enabled: false

# Keep tests hermetic: no scheduled TMDB calls, but give the props valid (dummy) values so the
# RestClient bean and TmdbProps still wire up in a full-context test.
tmdb:
  enabled: false
  changes-enabled: false
  access-token: test-token
