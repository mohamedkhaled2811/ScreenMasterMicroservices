# Test-only config — no Postgres, no Eureka.
spring:
  datasource:
    url: jdbc:h2:mem:catalog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  liquibase:
    enabled: false
  # Repeated here for the test profile; hermetic tests never call Keycloak.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/cinema

eureka:
  client:
    enabled: false

# No scheduled TMDB calls in tests, but keep valid dummy values for wiring.
tmdb:
  enabled: false
  changes-enabled: false
  access-token: test-token
