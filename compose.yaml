# =============================================================================
#  ScreenMaster — the whole system on one machine.  BUILD_PLAN 1.4 (field guide M1).
#  Concepts: docs/concepts/containers-and-compose.md (the multi-service file)
#            docs/concepts/docker-fundamentals.md     (images/layers/volumes/networks)
#
#  Topology: gateway (front door) -> { catalog, booking, payment, notification },
#  all registering with the discovery (Eureka) server; database-per-service made
#  PHYSICAL as four separate Postgres containers; RabbitMQ + Zipkin run from day
#  one (services don't wire to them until Phase 4 / Phase 6).
#
#  Key ideas you can see here:
#   - SERVICE NAME = DNS NAME on the Compose network. `catalog` reaches its database
#     at `catalog-db:5432` and the registry at `discovery:8761` — no IPs.
#   - Only the EDGE is published to the host: gateway (8080), the Eureka dashboard
#     (8761), and the RabbitMQ/Zipkin consoles. Backend services stay internal.
#   - NO application.yml edits: every service already reads ${VAR:default} env hooks,
#     so we only inject values here.
#   - The EUREKA_INSTANCE_PREFER_IP_ADDRESS=true flag makes each client register its
#     routable Compose-network IP, so `lb://catalog` resolves to something other
#     containers can actually reach (the Eureka-on-Compose gotcha).
#
#  Run:   docker compose up --build         (build images + start everything)
#  Stop:  docker compose down               (keep db volumes)  /  down -v (wipe them)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  #  Discovery — the Eureka registry. Everything else registers with it.
  # ---------------------------------------------------------------------------
  discovery:
    build:
      # context = repo root so the Maven reactor (parent pom + sibling modules) is
      # visible to the build stage; dockerfile points at this module. (docker-fundamentals.md §6)
      context: .
      dockerfile: discovery/Dockerfile
    image: screenmaster/discovery
    environment:
      # Tracing: point the Zipkin exporter at the `zipkin` container (service name = DNS
      # name). NO depends_on on purpose — the exporter is asynchronous and batches: if Zipkin is
      # down the app keeps serving and simply drops spans. Tracing must never be in the critical path.
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Boot 4 key (management.tracing.export.zipkin.endpoint) as a relaxed-binding env var.
      # Redundant with the YAML above, but it lets a config fix land without rebuilding images.
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8761:8761"          # publish the dashboard so you can open http://localhost:8761
    networks: [screenmaster]

  # ---------------------------------------------------------------------------
  #  Gateway — the single public front door (the only app port on the host).
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: screenmaster/gateway
    ports:
      - "8080:8080"          # the ONLY public app entrypoint; clients only ever hit 8080
    environment:
      EUREKA_SERVICE_URL: http://discovery:8761/eureka/   # resolve the registry by service name
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"           # register a routable Compose-network IP
      # Phase 7: the ONE issuer URI every service pins (container DNS — the `keycloak` service
      # name; Keycloak mints exactly this `iss` via KC_HOSTNAME, see the keycloak block).
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/cinema
      # Tracing: the Zipkin exporter endpoint. No depends_on — see the discovery block.
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Boot 4 key (management.tracing.export.zipkin.endpoint) as a relaxed-binding env var.
      # Redundant with the YAML above, but it lets a config fix land without rebuilding images.
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      - discovery            # start after the registry process is up (clients retry anyway)
    networks: [screenmaster]

  # ---------------------------------------------------------------------------
  #  Catalog — owns catalog-db. No host port; reached only through the gateway.
  # ---------------------------------------------------------------------------
  catalog:
    build:
      context: .
      dockerfile: catalog/Dockerfile
    image: screenmaster/catalog
    environment:
      # Point the datasource at the catalog-db CONTAINER (service name = DNS name).
      CATALOG_DB_URL: jdbc:postgresql://catalog-db:5432/catalog
      CATALOG_DB_USER: postgres
      CATALOG_DB_PASSWORD: postgres
      EUREKA_SERVICE_URL: http://discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # TMDB sync: the v4 Read Access Token comes from the host env / root .env (never committed).
      # Sync is OFF by default so `docker compose up` works with no token; set TMDB_API_KEY in .env
      # and TMDB_SYNC_ENABLED=true to fill the catalog. See .env.example.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_SYNC_ENABLED: ${TMDB_SYNC_ENABLED:-false}
      # Catalog PUBLISHES MovieUpserted to the broker (CQRS read model, 2.3). service name = DNS name.
      RABBITMQ_HOST: rabbitmq
      # Phase 7: the ONE issuer URI every service pins (see the gateway block).
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/cinema
      # Tracing: the Zipkin exporter endpoint. No depends_on — see the discovery block.
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Boot 4 key (management.tracing.export.zipkin.endpoint) as a relaxed-binding env var.
      # Redundant with the YAML above, but it lets a config fix land without rebuilding images.
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      catalog-db:
        condition: service_healthy   # don't boot until Postgres answers pg_isready (no race)
      discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [screenmaster]

  # ---------------------------------------------------------------------------
  #  Booking — owns booking-db. The core service (absorbs Theater + Scheduling).
  # ---------------------------------------------------------------------------
  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    image: screenmaster/booking
    environment:
      BOOKING_DB_URL: jdbc:postgresql://booking-db:5432/booking
      BOOKING_DB_USER: postgres
      BOOKING_DB_PASSWORD: postgres
      EUREKA_SERVICE_URL: http://discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Booking CONSUMES MovieUpserted from the broker into its movie_projections read model (2.3).
      RABBITMQ_HOST: rabbitmq
      # Phase 7: the ONE issuer URI every service pins (see the gateway block).
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/cinema
      # Tracing: the Zipkin exporter endpoint. No depends_on — see the discovery block.
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Boot 4 key (management.tracing.export.zipkin.endpoint) as a relaxed-binding env var.
      # Redundant with the YAML above, but it lets a config fix land without rebuilding images.
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      booking-db:
        condition: service_healthy
      discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [screenmaster]

  # ---------------------------------------------------------------------------
  #  Payment — real gateways (Stripe + Paymob, SANDBOX mode) behind one port;
  #  owns payment-db. Credentials come from the root .env (never committed).
  #  Gateways cannot reach localhost, so webhooks arrive via a tunnel:
  #    Stripe: stripe listen --forward-to localhost:8080/api/payments/webhooks/stripe
  #    Paymob: ngrok http 8080, then paste the URL into the Paymob dashboard
  #  PAYMENT_PUBLIC_URL is what the service tells each gateway to call back on.
  # ---------------------------------------------------------------------------
  payment:
    build:
      context: .
      dockerfile: payment/Dockerfile
    image: screenmaster/payment
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/payment
      PAYMENT_DB_USER: postgres
      PAYMENT_DB_PASSWORD: postgres
      # Public base URL the gateways call back on (tunnel URL in local dev).
      PAYMENT_PUBLIC_URL: ${PAYMENT_PUBLIC_URL:-http://localhost:8080}
      # --- Gateway credentials: SANDBOX/TEST ONLY. Empty -> that adapter is not
      #     registered (@ConditionalOnProperty), so it simply is not offered. ---
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYMOB_API_KEY: ${PAYMOB_API_KEY:-}
      PAYMOB_HMAC_SECRET: ${PAYMOB_HMAC_SECRET:-}
      PAYMOB_INTEGRATION_ID: ${PAYMOB_INTEGRATION_ID:-}
      PAYMOB_IFRAME_ID: ${PAYMOB_IFRAME_ID:-}
      # The controllable adapter that replaces the old FAIL_RATE knob: always
      # registered, signs its own webhooks, and drives the Phase 3.7 / Phase 5 demos.
      PAYMENT_SANDBOX_FAILURE_RATE: ${PAYMENT_SANDBOX_FAILURE_RATE:-0.0}
      PAYMENT_SANDBOX_UNAVAILABLE_RATE: ${PAYMENT_SANDBOX_UNAVAILABLE_RATE:-0.0}
      PAYMENT_SANDBOX_LATENCY_MILLIS: ${PAYMENT_SANDBOX_LATENCY_MILLIS:-300}
      PAYMENT_SANDBOX_SESSION_TTL: ${PAYMENT_SANDBOX_SESSION_TTL:-PT10M}
      PAYMENT_SANDBOX_WEBHOOK_SECRET: ${PAYMENT_SANDBOX_WEBHOOK_SECRET:-sandbox-local-development-secret}
      EUREKA_SERVICE_URL: http://discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Payment PUBLISHES PaymentSucceeded/PaymentFailed to the broker (transactional outbox, 3.2).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      # Phase 7: the ONE issuer URI every service pins (see the gateway block).
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/cinema
      # Tracing: the Zipkin exporter endpoint. No depends_on — see the discovery block.
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Boot 4 key (management.tracing.export.zipkin.endpoint) as a relaxed-binding env var.
      # Redundant with the YAML above, but it lets a config fix land without rebuilding images.
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      payment-db:
        condition: service_healthy
      discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks: [screenmaster]

  # ---------------------------------------------------------------------------
  #  Notification — event consumer (Phase 4.3); owns notification-db. Listens for
  #  BookingConfirmed / BookingConfirmationRejected and "sends" the email (a log line),
  #  deduping via processed_events. No host port — reached only through the broker.
  # ---------------------------------------------------------------------------
  notification:
    build:
      context: .
      dockerfile: notification/Dockerfile
    image: screenmaster/notification
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/notification
      NOTIFICATION_DB_USER: postgres
      NOTIFICATION_DB_PASSWORD: postgres
      EUREKA_SERVICE_URL: http://discovery:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Notification CONSUMES Booking's booking-outcome stream from the broker (4.3).
      RABBITMQ_HOST: rabbitmq
      # Phase 7: the ONE issuer URI every service pins (see the gateway block).
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/cinema
      # Phase 7 (7.6): this service's OWN identity toward Keycloak (client-credentials grant for
      # the notification-svc client). Dev default matches the DEV realm JSON; production sets this
      # in .env — never committed.
      NOTIFICATION_SVC_SECRET: ${NOTIFICATION_SVC_SECRET:-notification-svc-dev-secret}
      # SMTP. Mailpit in the lab; production overrides these four to a real provider with NO code
      # change (that is the whole point of going through JavaMailSender). Auth is off because
      # Mailpit accepts anything — MAIL_USERNAME/MAIL_PASSWORD stay empty here and come from .env
      # when pointed at a real provider.
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      # The From: address on every ticket. Must be a domain the provider is allowed to send as.
      NOTIFICATION_MAIL_FROM: ${NOTIFICATION_MAIL_FROM:-tickets@screenmaster.local}
      # Poster images: Catalog stores TMDB *paths* (/abc.jpg); the email needs a full URL. Same base
      # as catalog's TMDB_IMAGE_BASE_URL — w780 is a good width for a ~600px email body.
      NOTIFICATION_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
      # Tracing: the Zipkin exporter endpoint. No depends_on — see the discovery block.
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      # Boot 4 key (management.tracing.export.zipkin.endpoint) as a relaxed-binding env var.
      # Redundant with the YAML above, but it lets a config fix land without rebuilding images.
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      notification-db:
        condition: service_healthy   # don't boot until Postgres answers pg_isready (no race)
      discovery:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      # No condition: service_healthy — Mailpit has no healthcheck and a send that races its
      # startup simply fails, nacks, and redelivers. The consumer is idempotent; that is the
      # retry path working as designed, not a race worth gating boot on.
      mailpit:
        condition: service_started
    networks: [screenmaster]

  # ===========================================================================
  #  Datastores — database-per-service made physical: one Postgres per owner.
  #  pg_isready ships inside the postgres image, so it's a dependency-free
  #  healthcheck that app services gate on (condition: service_healthy above).
  #
  #  PORTS: published for LOCAL INSPECTION ONLY (DBeaver / psql from the host).
  #  Services never use these — they reach their own database in-network as
  #  catalog-db:5432 etc., and only their own. The host mapping is a dev-time
  #  convenience, NOT a licence to cross the boundary: no service may connect to
  #  another service's database, published or not.
  #  Bound to 127.0.0.1 so they are unreachable from the LAN (a bare "5442:5432"
  #  would bypass most host firewalls). Host ports are 544x, not 5432, to avoid
  #  colliding with a natively installed Postgres already holding 5432.
  # ===========================================================================
  catalog-db:
    image: postgres:16
    ports:
      - "127.0.0.1:5442:5432"
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - catalog-db-data:/var/lib/postgresql/data   # named volume: data survives `down` (not `down -v`)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [screenmaster]

  booking-db:
    image: postgres:16
    ports:
      - "127.0.0.1:5443:5432"
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [screenmaster]

  payment-db:
    image: postgres:16
    ports:
      - "127.0.0.1:5444:5432"
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [screenmaster]

  # notification-db: the 4th Postgres, owned by the event consumer. Unlike its siblings it is
  # deliberately NOT published to the host — this service has no business HTTP surface, so there is
  # nothing to inspect from a host client; it stays purely internal (backend services stay internal).
  notification-db:
    image: postgres:16
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [screenmaster]

  # keycloak-db: the 5th Postgres, owned by Keycloak alone. Same shape as its siblings; unlike them
  # it is also internal-only (no host port — the realm is managed through Keycloak's own console).
  keycloak-db:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [screenmaster]

  # ===========================================================================
  #  Identity — Keycloak, the only service that ever sees a password (Phase 7,
  #  field guide M7). Owns users, credentials, emails and roles; every other service
  #  only ever sees the signed JWTs it mints.
  #
  #  THE ONE-ISSUER RULE (the #1 Keycloak-in-Docker problem): a JWT's `iss` is the URL
  #  Keycloak was reached at — EXCEPT Keycloak is told a fixed frontend hostname here
  #  (KC_HOSTNAME=keycloak, strict), so it ALWAYS mints `iss=http://keycloak:8180/...`
  #  no matter who asked. Host callers reach it as localhost:8180 (published port) to
  #  FETCH tokens; container callers reach it as keycloak:8180 (service DNS) to VALIDATE
  #  them and fetch the JWKS — and both sides agree on ONE `iss`, which is what the
  #  services' `issuer-uri` pins. Two URLs for transport, one URL for identity.
  #
  #  Why 8180 on BOTH sides (not 8080 inside): the gateway already owns host port 8080,
  #  so Keycloak listens on 8180 inside its container too (KC_HTTP_PORT) — container
  #  callers use keycloak:8180, host callers use localhost:8180, and the minted `iss`
  #  matches both. A host-local `./mvnw spring-boot:run` needs `keycloak` to resolve —
  #  add `127.0.0.1 keycloak` to /etc/hosts — because `localhost` would mint a
  #  different `iss` and fail validation.
  #
  #  Realm `cinema` is imported from the committed keycloak/realms/cinema-realm.json
  #  (--import-realm over a read-only mount): `docker compose up` alone brings the realm
  #  up correctly — no manual console clicking. First boot takes ~30-60s (migrations).
  # ===========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # start-dev: HTTP, relaxed prod checks — right for a local lab (production runs
    # `start --optimized` behind TLS at an ingress). --import-realm loads the realm file.
    command: start-dev --import-realm
    ports:
      - "8180:8180"          # token fetching from the host (get-token.sh hits localhost:8180)
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      # Bootstrap console admin (dev default; override in .env — never the seeded app users).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # The one-issuer rule above, as env: listen on 8180, mint `iss` for keycloak:8180, strictly.
      KC_HTTP_PORT: 8180
      KC_HOSTNAME: http://keycloak:8180
      KC_HOSTNAME_ADMIN: http://localhost:8180
      KC_HOSTNAME_STRICT: "true"
      # Tracing: the Zipkin exporter endpoint. No depends_on — see the discovery block.
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro   # the realm JSON (committed, reviewed)
    healthcheck:
      # Keycloak's own readiness probe. Generous start_period: the first boot runs DB
      # migrations and realm import (~30-60s). Nothing gates on this health (services boot
      # WITHOUT Keycloak thanks to their lazy JWKS decoders) — it is observability only.
      test: ["CMD-SHELL", "curl -f http://localhost:8180/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    depends_on:
      keycloak-db:
        condition: service_healthy   # don't boot until Postgres answers pg_isready (no race)
    networks: [screenmaster]

  # ===========================================================================
  #  Broker + tracing — run now, WIRED LATER. RabbitMQ is consumed in Phase 4;
  #  Zipkin receives traces in Phase 6. Present here so the topology is complete
  #  and later phases just connect to containers that already exist.
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"          # AMQP (producers/consumers) — the CQRS MovieUpserted stream (2.3) onward
      - "15672:15672"        # management console -> http://localhost:15672 (guest/guest)
    healthcheck:             # catalog+booking gate on this (condition: service_healthy) so no publish/consume races the broker
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [screenmaster]

  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"          # trace UI + collector -> http://localhost:9411 (used from Phase 6)
    networks: [screenmaster]

  # ===========================================================================
  #  Mailpit — a FAKE SMTP server with a web inbox. Notification points
  #  spring.mail.host here, so the send path is real SMTP through a real
  #  JavaMailSender; only the far end is local. Open http://localhost:8025 to
  #  SEE the rendered ticket, which is the only practical way to iterate on
  #  HTML email (the markup is table-based and client-quirky — you have to look
  #  at it). Mailpit is the maintained successor to the archived MailHog.
  #
  #  Why not a real provider in dev: credentials to manage, deliverability
  #  rabbit holes (SPF/DKIM), rate limits, and every `--scale notification=2`
  #  dedupe experiment would mail a real human. Switching to SES/SendGrid later
  #  is FOUR config properties and ZERO code — spring.mail.* via env.
  # ===========================================================================
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"          # web inbox -> http://localhost:8025 (look at the ticket here)
      - "1025:1025"          # SMTP — what notification's JavaMailSender connects to
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"      # dev: any credentials pass (there are none)
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"  # dev: no TLS on the loopback network
    networks: [screenmaster]

# A dedicated network so service names resolve as DNS and the stack is isolated
# from anything else running on the host's default bridge.
networks:
  screenmaster:
    driver: bridge

# Named volumes keep each database's files outside the container's throwaway
# writable layer (docker-fundamentals.md §3c) — `down` preserves them, `down -v` wipes.
volumes:
  catalog-db-data:
  booking-db-data:
  payment-db-data:
  notification-db-data:
  keycloak-db-data:
