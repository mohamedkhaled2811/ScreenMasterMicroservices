# =============================================================================
#  discovery — Netflix Eureka SERVER (the service registry)
# =============================================================================

server:
  # The conventional Eureka port.
  port: 8761

spring:
  application:
    # Registry id + log-line name.
    name: discovery

eureka:
  instance:
    hostname: localhost
  client:
    # Single node: don't register with or fetch from itself.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Off so stopped services disappear from the dashboard promptly.
    enable-self-preservation: false
    # How often expired leases are swept (default 60s).
    eviction-interval-timer-in-ms: 15000

# Distributed tracing: sample 100% locally; production uses ~0.1.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    # Zipkin export endpoint.
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Structured logging with a trace-id slot.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
