<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="keycloak-identity-title keycloak-identity-desc">
      <title id="keycloak-identity-title">Keycloak identity: the three token paths</title>
      <desc id="keycloak-identity-desc">Architecture diagram showing how a browser login becomes a user JWT that the gateway and every ScreenMaster service validate independently against Keycloak, how Payment relays that same user token into Booking, and how Notification acts on its own machine token to look up users.</desc><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="11" cy="11" r="0.8" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        <!-- ===== icons — inlined as translated groups, NOT symbol/use =====
             The house idiom is <symbol> + <use>, and this file used it originally
             (dual href/xlink:href, color= + currentColor). But this checkout's
             rasterizer (old librsvg via ImageMagick) renders <use> -> <symbol> as
             NOTHING and ignores currentColor entirely — verified with minimal
             repros: use->g and hardcoded inline strokes render, use->symbol and
             any currentColor form render zero pixels. Each glyph below is placed
             exactly once, so inlining costs no duplication and renders in every
             renderer. Recolour by changing the stroke on the <g>. -->
        <!-- Keycloak mark: hexagonal badge + inner keyhole, 24x24, 1.5px -->
      </defs>

      <!-- ============ background ============ -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ============ zones (drawn first: bg -> zones -> arrows -> nodes) ============ -->

      <!-- Zone: EDGE -->
      <rect x="32" y="64" width="280" height="288" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="52" y="68" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="78" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EDGE</text>

      <!-- Zone: SERVICES -->
      <rect x="344" y="64" width="336" height="372" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="364" y="68" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICES</text>

      <!-- Zone: IDENTITY AUTHORITY -->
      <rect x="708" y="64" width="224" height="304" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="724" y="68" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="762" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">IDENTITY</text>

      <!-- ============ arrows (before boxes, so z-order puts them behind) ============ -->

      <!-- A1: Client -> Keycloak token acquisition, over the top -->
      <path d="M 172,104 V 96 Q 172,88 180,88 H 812 Q 820,88 820,96 V 104"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="196" y="68" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="232" y="77" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET TOKEN</text>

      <!-- A2: Client -> Gateway bearer JWT, straight down, shared x -->
      <line x1="172" y1="192" x2="172" y2="220" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="180" y="200" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="218" y="209" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BEARER JWT</text>

      <!-- A3a: Gateway -> Payment, same header proxied, shared y -->
      <line x1="288" y1="252" x2="368" y2="252" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="296" y="232" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="328" y="241" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAME HEADER</text>

      <!-- A3b: Gateway -> Notification, same header via the lower channel, unlabeled -->
      <path d="M 200,316 V 324 Q 200,332 208,332 H 580 Q 588,332 588,324 V 316"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- A4: Payment -> Booking user-token relay, straight up, shared x -->
      <line x1="436" y1="220" x2="436" y2="192" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="444" y="196" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="205" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USER RELAY</text>

      <!-- A5: Notification -> Keycloak machine token, dashed, up the inter-zone gap -->
      <path d="M 656,292 H 688 Q 696,292 696,284 V 188 Q 696,180 704,180 H 724"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="654" y="350" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="696" y="359" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MACHINE TOKEN</text>

      <!-- A6: services zone -> Keycloak, each validates its copy via JWKS -->
      <line x1="680" y1="140" x2="724" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="672" y="120" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="696" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JWKS ×5</text>

      <!-- A7: Keycloak -> keycloak-db, straight down, shared x, unlabeled -->
      <line x1="820" y1="252" x2="820" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ nodes ============ -->

      <!-- Client / browser (external) -->
      <rect x="56" y="104" width="232" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="104" width="232" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="64" y="112" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="96" y="121" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <g transform="translate(256,112)" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.5"/>
        <path d="M5 20a7 7 0 0 1 14 0"/>
      </g>
      <text x="172" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client / browser</text>
      <text x="172" y="170" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cinema-web · code + PKCE</text>
      <text x="172" y="182" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dev-cli · direct grant</text>

      <!-- Gateway (edge) -->
      <rect x="56" y="220" width="232" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="220" width="232" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="64" y="228" width="76" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="102" y="237" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE · :8080</text>
      <g transform="translate(256,228)" fill="none" stroke="#2d3142" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20v-9a8 8 0 0 1 16 0v9"/>
        <path d="M9 20v-6a3 3 0 0 1 6 0v6"/>
      </g>
      <text x="172" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gateway</text>
      <text x="172" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">validates JWT · fail fast</text>
      <text x="172" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proxies header · strips X-User-Id</text>

      <!-- Booking -->
      <rect x="368" y="104" width="136" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="368" y="104" width="136" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="376" y="112" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="404" y="121" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVICE</text>
      <text x="436" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Booking</text>
      <text x="436" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">serves payability</text>
      <text x="436" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ADMIN writes gated</text>

      <!-- Catalog -->
      <rect x="520" y="104" width="136" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="104" width="136" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="528" y="112" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="556" y="121" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVICE</text>
      <text x="588" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Catalog</text>
      <text x="588" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">behind gateway</text>
      <text x="588" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same JWT · USER reads</text>

      <!-- Payment -->
      <rect x="368" y="220" width="136" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="368" y="220" width="136" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="376" y="228" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="404" y="237" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVICE</text>
      <text x="436" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Payment</text>
      <text x="436" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /payments</text>
      <text x="436" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">relays user token</text>

      <!-- Notification -->
      <rect x="520" y="220" width="136" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="220" width="136" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="528" y="228" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="556" y="237" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVICE</text>
      <text x="588" y="270" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Notification</text>
      <text x="588" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">listener + sweep</text>
      <text x="588" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no user in scope</text>

      <!-- Role-mapping note (annotation, not a node): the JWKS edge's other half — what each
           service does AFTER the signature checks out. Anchored by a hairline leader up the
           right gutter to the JWKS arrow, so it reads as a note ON that edge rather than a
           caption floating under the services zone. -->
      <path d="M 668,348 H 672 Q 676,348 676,344 V 144 Q 676,140 680,140"
            fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <circle cx="680" cy="140" r="1.8" fill="rgba(45,49,66,0.30)"/>
      <text x="500" y="360" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ROLE MAPPING · ONE COPY PER SERVICE</text>
      <text x="500" y="380" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">realm_access.roles → ROLE_* — never scope</text>

      <!-- Keycloak (FOCAL) -->
      <rect x="724" y="104" width="192" height="148" rx="6" fill="#f5f5f5"/>
      <rect x="724" y="104" width="192" height="148" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="732" y="112" width="84" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="774" y="121" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDP · :8180</text>
      <g transform="translate(884,112)" fill="none" stroke="#eb6c36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12l-4.5 7.8H7.5L3 12l4.5-7.8h9z"/>
        <circle cx="12" cy="10" r="2.5"/>
        <path d="M10.8 12.2L10 17h4l-0.8-4.8"/>
      </g>
      <text x="820" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Keycloak 26.0</text>

      <!-- Client strip: the realm's four clients, so every arrow into/out of this node
           lands on a NAMED client rather than an anonymous box. Left column = client id,
           right column = public/confidential + its one allowed grant. -->
      <line x1="736" y1="158" x2="904" y2="158" stroke="rgba(235,108,54,0.25)" stroke-width="0.8"/>

      <text x="736" y="173" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">cinema-web</text>
      <text x="904" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">code+PKCE</text>

      <text x="736" y="188" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">cinema-dev-cli</text>
      <text x="904" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">direct grant</text>

      <text x="736" y="203" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">payment-svc</text>
      <text x="904" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">client creds</text>

      <text x="736" y="218" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace">notification-svc</text>
      <text x="904" y="218" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">client creds</text>

      <line x1="736" y1="228" x2="904" y2="228" stroke="rgba(235,108,54,0.25)" stroke-width="0.8"/>
      <text x="820" y="243" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">realm cinema · iss keycloak:8180</text>

      <!-- keycloak-db (owned store) -->
      <rect x="724" y="264" width="192" height="84" rx="6" fill="#f5f5f5"/>
      <rect x="724" y="264" width="192" height="84" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="732" y="272" width="52" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="758" y="281" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <g transform="translate(884,272)" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="6" rx="7" ry="2.5"/>
        <path d="M5 6v12a7 2.5 0 0 0 14 0V6"/>
      </g>
      <text x="820" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">keycloak-db</text>
      <text x="820" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Postgres · realm data</text>

      <!-- ============ legend ============ -->
      <line x1="32" y1="468" x2="928" y2="468" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <!-- focal -->
      <rect x="104" y="480" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="128" y="490" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL · IDP</text>

      <!-- service -->
      <rect x="248" y="480" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="272" y="490" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SERVICE / EDGE</text>

      <!-- external -->
      <rect x="432" y="480" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="456" y="490" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">EXTERNAL</text>

      <!-- store -->
      <rect x="576" y="480" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="600" y="490" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">OWNED STORE</text>

      <!-- user-jwt line -->
      <line x1="32" y1="516" x2="64" y2="516" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="76" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">USER JWT · SOLID</text>

      <!-- machine line -->
      <line x1="280" y1="516" x2="312" y2="516" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="324" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">MACHINE · DASHED</text>

      <!-- jwks line -->
      <line x1="520" y1="516" x2="552" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="564" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">JWKS CHECK</text>
    </svg>