<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--paper:#f7f5ef;--ink:#1a1a2e;--muted:#4f5d75;--accent:#b8860b;
    --sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
  .frame{max-width:1480px;width:100%}
  .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
  h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2.1rem);font-weight:400;
    letter-spacing:-.02em;line-height:1.15;margin-bottom:.4rem}
  .sub{font-size:.9rem;color:var(--muted);margin-bottom:1.6rem;max-width:62ch}
  svg{width:100%;min-width:1100px;display:block}
  footer{margin-top:1.5rem;padding-top:.75rem;border-top:1px solid rgba(26,26,46,0.12);
    font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Patterns · ScreenMaster</p>
  <h1>Which pattern lives in which service</h1>
  <p class="sub">Each service carries the patterns its job forces on it. The name under every pattern is the class that implements it — this diagram doubles as an index into the code.</p>

  <svg viewBox="0 0 1480 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="patterns-map-title patterns-map-desc">
    <title id="patterns-map-title">ScreenMaster — Patterns Map</title>
    <desc id="patterns-map-desc">Four ScreenMaster services shown side by side, each listing the microservices patterns it implements and the class implementing each one. Catalog carries the specification filter and an event publisher; Booking carries the saga orchestrator, a CQRS read model, and a transactional outbox; Payment carries ports and adapters with a resilience decorator, an idempotent webhook consumer, and the compensating refund; Notification carries an idempotent consumer and a channel port. A cross-cutting band below lists the patterns every service shares: API gateway, service discovery, database per service, distributed tracing, and problem-detail errors.</desc>

      <marker id="arrow-event" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6d28d9"/></marker>
    </defs>

    <text x="175" y="605" fill="rgba(26,26,46,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CROSS-CUTTING · EVERY SERVICE</text>
