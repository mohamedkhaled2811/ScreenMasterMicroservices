# =============================================================================
#  gateway — Spring Cloud Gateway, the single public front door
# =============================================================================

server:
  # Public HTTP port. Backends are not meant to be hit directly.
  port: 8080

spring:
  application:
    # Registry id + log-line name.
    name: gateway

  # OAuth2 resource server: validates the Bearer JWT before routing.
  # ONE issuer URI feeds both the accepted `iss` and the JWKS fetch URL.
  # No TokenRelay filter needed: the inbound Authorization header is proxied as-is.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/cinema}

  cloud:
    gateway:
      server:
        webmvc:
          # Each route = predicate + uri + filters. lb:// resolves through Eureka.
          routes:
            - id: catalog
              uri: lb://catalog
              predicates:
                - Path=/api/movies/**
              filters:
                # StripPrefix=1: /api/movies/7 -> /movies/7. /api is edge-only.
                - StripPrefix=1
                # Strip the legacy identity header; identity is the JWT `sub` now.
                - RemoveRequestHeader=X-User-Id
            - id: booking
              uri: lb://booking
              # Booking owns bookings + inventory + showtimes. One route, several prefixes.
              predicates:
                - Path=/api/bookings/**,/api/theaters/**,/api/screens/**,/api/seat-types/**,/api/showtimes/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=X-User-Id
            - id: payment
              uri: lb://payment
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=X-User-Id

            # ---- OpenAPI docs proxying --------------------------
            # The Swagger UI fetches specs through the gateway (same-origin), e.g.
            # /catalog/v3/api-docs -> lb://catalog/v3/api-docs.
            - id: catalog-docs
              uri: lb://catalog
              predicates:
                - Path=/catalog/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: booking-docs
              uri: lb://booking
              predicates:
                - Path=/booking/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: payment-docs
              uri: lb://payment
              predicates:
                - Path=/payment/v3/api-docs/**
              filters:
                - StripPrefix=1

# Swagger UI aggregation: one UI with a dropdown over the backend specs (proxied above).
# Do NOT disable api-docs here — the UI bootstraps from /v3/api-docs/swagger-config.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: catalog
        url: /catalog/v3/api-docs
      - name: booking
        url: /booking/v3/api-docs
      - name: payment
        url: /payment/v3/api-docs

# A Eureka CLIENT: registers and reads the registry so lb:// resolves.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

# Distributed tracing: sample 100% locally; production uses ~0.1.
# The gateway is where traces are born.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    # Zipkin export endpoint.
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Shared structured log pattern with a trace-id slot.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
