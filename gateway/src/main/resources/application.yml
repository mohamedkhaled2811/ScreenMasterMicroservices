# =============================================================================
#  gateway — Spring Cloud Gateway (web-mvc), the single public front door
#  BUILD_PLAN 1.3 · concept: docs/concepts/api-gateway-and-bff.md
#  Routing only at this milestone; edge auth + rate limiting land in Phase 7.
#  Localhost-friendly; Compose (1.4) injects container-DNS overrides via env.
# =============================================================================

server:
  # The conventional public HTTP port. Backend services sit on 8081–8084 and are
  # NOT meant to be hit directly — clients only ever talk to 8080.
  port: 8080

spring:
  application:
    # Registry id + log-line name. The gateway registers itself too (handy in the
    # Eureka dashboard), though nothing routes *to* it.
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          # Each route = a predicate (which requests match) + a uri (where they go) + filters
          # (how the request is transformed on the way). lb://name resolves through Eureka and
          # load-balances across that service's healthy instances — so a service is reachable as
          # soon as it registers, with no gateway edit. See concepts/service-discovery.md.
          routes:
            - id: catalog
              uri: lb://catalog
              predicates:
                - Path=/api/movies/**
              filters:
                # StripPrefix=1 drops the leading /api segment: /api/movies/7 -> /movies/7.
                # The /api namespace is an EDGE concern only; services keep bare paths. (Option A.)
                - StripPrefix=1
            - id: booking
              uri: lb://booking
              # Booking absorbed the monolith's Theater + Scheduling contexts (schema §8.1), so it now
              # owns the inventory + showtime surface too. One route, several path prefixes: bookings,
              # the inventory tree (theaters/screens/seats), seat-types, and showtimes. StripPrefix=1
              # turns each /api/<x> into the bare /<x> the controllers expose (e.g. /api/theaters ->
              # /theaters). A single Path predicate accepts a comma-separated list of patterns.
              predicates:
                - Path=/api/bookings/**,/api/theaters/**,/api/screens/**,/api/seat-types/**,/api/showtimes/**
              filters:
                - StripPrefix=1
            - id: payment
              uri: lb://payment
              predicates:
                - Path=/api/payments/**
              filters:
                # /api/payments -> /payments, matching PaymentController's @RequestMapping("/payments").
                - StripPrefix=1

            # ---- OpenAPI docs proxying (see concepts/openapi-springdoc.md) --------------------------
            # The aggregated Swagger UI (below) fetches each service's spec from the browser, so those
            # specs must be reachable THROUGH the gateway (same-origin — no CORS). Each route exposes a
            # service's spec at /<service>/v3/api-docs and StripPrefix=1 turns that into the bare
            # /v3/api-docs the service actually serves. These are docs-only routes; the real API traffic
            # still flows through the /api/** routes above.
            - id: catalog-docs
              uri: lb://catalog
              predicates:
                - Path=/catalog/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: booking-docs
              uri: lb://booking
              predicates:
                - Path=/booking/v3/api-docs/**
              filters:
                - StripPrefix=1
            - id: payment-docs
              uri: lb://payment
              predicates:
                - Path=/payment/v3/api-docs/**
              filters:
                - StripPrefix=1

# OpenAPI / Swagger UI aggregation (see docs/concepts/openapi-springdoc.md). The gateway owns no
# controllers, so it documents no spec of its own; instead the Swagger UI at :8080/swagger-ui.html is
# pointed at each backend service's spec (proxied via the *-docs routes above) as a dropdown. The
# frontend dev opens ONE URL and switches between catalog / booking / payment.
#
# IMPORTANT: do NOT set springdoc.api-docs.enabled=false here. The Swagger UI bootstraps by fetching
# /v3/api-docs/swagger-config (the endpoint that hands the UI its dropdown of spec URLs); that endpoint
# is part of the api-docs machinery, and disabling api-docs also switches off the /swagger-ui.html
# welcome/redirect controller — the UI then 404s. The gateway has no @RestControllers, so leaving
# api-docs enabled produces only an empty own-spec that nothing points at; the `urls` below still drive
# the dropdown to the backend services only. (See the whitelabel-404 we hit when api-docs was disabled.)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: catalog
        url: /catalog/v3/api-docs
      - name: booking
        url: /booking/v3/api-docs
      - name: payment
        url: /payment/v3/api-docs

# A Eureka CLIENT: registers with the discovery server and reads the registry so lb:// resolves.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

# Shared structured log pattern with a trace-id slot (empty until Phase 6 wires tracing).
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
