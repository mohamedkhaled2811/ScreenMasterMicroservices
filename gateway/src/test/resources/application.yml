# Test-only config. NOTE: this file has the same name as the main application.yml, so it
# REPLACES it on the test classpath rather than merging — Spring does not combine two files
# named application.yml. Anything the tests need from the main config must therefore be
# repeated here, INCLUDING the routes (proven: without them the route list is empty in tests
# and every path falls through to the security chain with nothing to route).
#
# The routes below mirror the main application.yml closely enough to exercise edge security.
# They point at a non-existent host on purpose: these tests assert the SECURITY outcome
# (rejected vs. allowed through), never a successful proxy.
eureka:
  client:
    enabled: false

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/cinema
  cloud:
    gateway:
      mvc:
        routes:
          - id: payment
            uri: http://payment.invalid:8083
            predicates:
              - Path=/api/payments/**
            filters:
              - StripPrefix=1
              - RemoveRequestHeader=X-User-Id
