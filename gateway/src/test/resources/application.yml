# Test-only config. This file REPLACES the main application.yml on the test classpath,
# so needed routes are repeated here. They point at a non-existent host on purpose:
# tests assert the security outcome, never a successful proxy.
eureka:
  client:
    enabled: false

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/cinema
  cloud:
    gateway:
      mvc:
        routes:
          - id: payment
            uri: http://payment.invalid:8083
            predicates:
              - Path=/api/payments/**
            filters:
              - StripPrefix=1
              - RemoveRequestHeader=X-User-Id
