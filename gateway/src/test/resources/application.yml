# Test-only config — keeps the contextLoads smoke test hermetic (no Eureka registry needed).
# The gateway owns no DB, so there is nothing else to stub out; the real routes from the main
# application.yml still load and are parsed (that's part of what this test guards).
eureka:
  client:
    enabled: false

# Phase 7: the test file SHADOWS the main application.yml (a full-context test does not see
# main-only nested keys — see the Boot-4 trap note in the Phase 7 report), so the resource-server
# issuer URI is repeated here. The value only feeds the lazy JwtDecoder bean definition (no network
# at boot) — hermetic tests never call Keycloak.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/cinema
