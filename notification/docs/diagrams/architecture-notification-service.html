  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>

    <p class="eyebrow">Architecture · ScreenMaster Notification</p>
    <h1>An event consumer with no HTTP API</h1>

    <svg viewBox="0 0 952 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="notification-architecture-title notification-architecture-desc">
      <title id="notification-architecture-title">Notification · Service Architecture</title>
      <desc id="notification-architecture-desc">Architecture diagram of the ScreenMaster Notification service, an event consumer with no HTTP API: Booking publishes BookingConfirmed and BookingConfirmationRejected into the shared screenmaster-exchange, Notification's queue delivers them to BookingEventListener, which dispatches to NotificationService — whose claim() INSERT into processed_events is the idempotent-consumer dedupe — before KeycloakUserClient resolves the recipient via the Keycloak Admin API and EmailChannel sends a Thymeleaf-rendered ticket over SMTP, with exhausted messages dead-lettered to booking-events-dlq.</desc>
