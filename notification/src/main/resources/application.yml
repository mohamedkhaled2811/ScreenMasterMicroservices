server:
  port: 8084

spring:
  application:
    name: notification

  # Owns notification-db; credentials come from env vars with local-dev defaults.
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${NOTIFICATION_DB_USER:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:postgres}

  # Liquibase owns the schema; Hibernate only validates against it.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false   # keep the transaction boundary in the service

  # RabbitMQ consumer config; host defaults to localhost, Compose overrides it.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

    # Retry with backoff; exhausted messages go to the dead-letter queue.
    listener:
      simple:
        default-requeue-rejected: false   # exhausted messages go to the dead-letter queue
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 2s
          multiplier: 2.0
          max-interval: 30s               # 2s, 4s, 8s, 16s, 30s of backoff before the DLQ

  # SMTP is env-driven; defaults target a local Mailpit.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Auth and TLS off for Mailpit; enabled via env for real providers.
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # Timeouts prevent a hung SMTP connection from blocking the listener.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Inbound JWT validation plus outbound client-credentials registration for Keycloak.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/cinema}
      client:
        registration:
          notification-keycloak:
            client-id: notification-svc
            client-secret: ${NOTIFICATION_SVC_SECRET:notification-svc-dev-secret}
            authorization-grant-type: client_credentials
        provider:
          notification-keycloak:
            token-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/cinema}/protocol/openid-connect/token

# Eureka client registration.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

# Tracing sampled at 100%; the Zipkin endpoint is env-driven.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# Service settings bound by NotificationProps.
notification:
  mail:
    # From address for outgoing ticket mail.
    from: ${NOTIFICATION_MAIL_FROM:tickets@screenmaster.local}
    from-name: ${NOTIFICATION_MAIL_FROM_NAME:ScreenMaster}
  # Poster image host and size for rendering email images.
  image:
    base-url: ${NOTIFICATION_IMAGE_BASE_URL:https://image.tmdb.org/t/p}
    poster-size: ${NOTIFICATION_IMAGE_POSTER_SIZE:w780}
  identity:
    # Keycloak Admin API base for email lookup.
    server-url: ${KEYCLOAK_SERVER_URL:http://keycloak:8180}
    realm: ${KEYCLOAK_REALM:cinema}
    # Resolved-email cache TTL.
    email-cache-ttl: ${NOTIFICATION_EMAIL_CACHE_TTL:10m}
    email-cache-max-size: ${NOTIFICATION_EMAIL_CACHE_MAX_SIZE:10000}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"