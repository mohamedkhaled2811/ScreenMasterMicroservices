server:
  port: 8084

spring:
  application:
    name: notification

  # Owns notification-db. Credentials come from env vars (never hard-coded), with local-dev defaults
  # after the ':'. Compose overrides the URL/host via env.
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${NOTIFICATION_DB_USER:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:postgres}

  # Liquibase owns the schema; Hibernate only VALIDATEs the entities against it on boot.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false   # no lazy loading in the view layer; keep the tx boundary in the service

  # RabbitMQ — Notification CONSUMES BookingConfirmed / BookingConfirmationRejected here (BUILD_PLAN
  # 4.3). Host defaults to localhost for `mvn spring-boot:run`; Compose overrides RABBITMQ_HOST to
  # the `rabbitmq` container.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# A Eureka CLIENT: registers with the discovery server on startup. (No register/fetch overrides —
# those are server-only.) See docs/concepts/service-discovery.md.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

# Distributed tracing: sample 100% in the lab so every demo request appears
# in Zipkin. Production runs ~0.1 (10%) — recording every trace is expensive (CPU + span storage),
# and the sampling decision is made once at the first service and carried in the traceparent flag. The
# endpoint defaults to the local Zipkin; Compose points it at the `zipkin` container via ZIPKIN_ENDPOINT.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    # Boot 4 renamed this key: it is `management.tracing.export.zipkin.endpoint`, NOT the Boot 3
    # `management.zipkin.tracing.endpoint`. The old key binds to nothing and the sender silently
    # keeps its built-in default of http://localhost:9411 — which inside a container is the
    # container itself, so every export fails with ConnectException while the network is fine.
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"