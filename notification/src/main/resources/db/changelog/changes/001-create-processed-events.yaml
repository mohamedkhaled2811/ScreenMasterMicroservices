# processed_events dedupe table: one row per consumed event id.
# Assigned event_id PK rejects redeliveries; event_type and processed_at are forensics.
databaseChangeLog:
  - changeSet:
      id: 001-create-processed-events
      author: mohamed
      changes:
        - createTable:
            tableName: processed_events
            remarks: Idempotent-consumer dedupe table. One row per event id this service has processed.
            columns:
              - column:
                  name: event_id
                  type: BIGINT
                  remarks: The inbound event's id (Booking's outbox row id) — assigned, never generated.
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_processed_events
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(60)
                  remarks: BOOKING_CONFIRMED | BOOKING_CONFIRMATION_REJECTED
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: When this consumer claimed the event.
                  constraints:
                    nullable: false