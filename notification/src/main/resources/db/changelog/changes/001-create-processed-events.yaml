# Changeset 001 — processed_events: the idempotent-consumer dedupe table (BUILD_PLAN 4.3).
#
# The consumer-side half of at-least-once delivery. RabbitMQ guarantees a redelivered message is
# delivered again, so Notification must make "send the email" happen at most once per event. It does
# that by making the INSERT of this row THE CLAIM: processing claims the eventId first, and only a
# successful insert proceeds to send. A redelivery (or a concurrent second consumer — the
# --scale notification=2 demo) re-inserts the SAME eventId, the PK constraint rejects it, and the
# send is skipped. See docs/concepts/idempotent-consumer.md.
#
# Design notes:
# - event_id is the INBOUND event's id (Booking's outbox row id) — an ASSIGNED PK, deliberately NO
#   auto-increment, so a redelivered event collides with its own first claim instead of minting a
#   new row. A stable event id across redeliveries is a precondition of consumer dedupe.
# - event_type names the event this row deduped (BOOKING_CONFIRMED | BOOKING_CONFIRMATION_REJECTED)
#   — pure forensics, so the dedupe row tells you what it deduped.
# - processed_at is when THIS consumer claimed the event (its clock, not the publisher's).
databaseChangeLog:
  - changeSet:
      id: 001-create-processed-events
      author: mohamed
      changes:
        - createTable:
            tableName: processed_events
            remarks: Idempotent-consumer dedupe table. One row per event id this service has processed.
            columns:
              - column:
                  name: event_id
                  type: BIGINT
                  remarks: The inbound event's id (Booking's outbox row id) — assigned, never generated.
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_processed_events
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(60)
                  remarks: BOOKING_CONFIRMED | BOOKING_CONFIRMATION_REJECTED
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: When this consumer claimed the event.
                  constraints:
                    nullable: false