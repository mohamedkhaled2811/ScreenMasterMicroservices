# Test-only config — keeps the hermetic suite offline: no Postgres, no Eureka, no broker.
spring:
  # In-memory H2 instead of Postgres. PostgreSQL compatibility mode so the entity mappings behave
  # like production; Hibernate builds the schema (create-drop) for the test run.
  datasource:
    url: jdbc:h2:mem:notification;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  # Liquibase changesets are Postgres-flavoured; let Hibernate own the test schema instead.
  liquibase:
    enabled: false
  # Phase 7: the test file SHADOWS the main application.yml (a full-context test does not see
  # main-only nested keys — see the Boot-4 trap note in the Phase 7 report), so the resource-server
  # issuer URI and the machine-token registration are repeated here. Both are lazy (the JWKS URL is
  # fetched on first request, the token-uri on first machine-token call), so the hermetic suite —
  # H2, Eureka off, listener stopped — still needs no Keycloak. The secret below is the DEV value
  # matching the DEV realm JSON; it never leaves the test JVM.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/cinema
      client:
        registration:
          notification-keycloak:
            client-id: notification-svc
            client-secret: notification-svc-dev-secret
            authorization-grant-type: client_credentials
        provider:
          notification-keycloak:
            token-uri: http://keycloak:8180/realms/cinema/protocol/openid-connect/token

  # MailSenderAutoConfiguration is @ConditionalOnProperty("spring.mail.host") — and because this
  # test file SHADOWS the main application.yml (the same Boot-4 trap the block above documents), the
  # main file's spring.mail.host is invisible here. Without this, no JavaMailSender bean exists and
  # EmailChannel cannot be constructed, so the whole context fails to load.
  #
  # Nothing is ever sent: no test drives EmailChannel against this host, and JavaMailSender connects
  # LAZILY — on the first send, not at startup — so pointing at a port with nothing behind it keeps
  # the suite hermetic while still proving the bean wires up.
  mail:
    host: localhost
    port: 1025

# Don't try to reach a Eureka server during tests.
eureka:
  client:
    enabled: false

# No broker in the hermetic suite: the @RabbitListener container stays stopped
# (BookingEventListener is driven directly in its own test).
notification:
  amqp:
    listener:
      auto-startup: false