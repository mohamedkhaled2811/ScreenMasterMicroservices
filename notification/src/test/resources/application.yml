# Test-only config: H2, no Eureka, no broker.
spring:
  # In-memory H2 with a Hibernate-created schema.
  datasource:
    url: jdbc:h2:mem:notification;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  # Liquibase off; Hibernate owns the test schema.
  liquibase:
    enabled: false
  # OAuth2 issuer and machine-token registration for tests.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/cinema
      client:
        registration:
          notification-keycloak:
            client-id: notification-svc
            client-secret: notification-svc-dev-secret
            authorization-grant-type: client_credentials
        provider:
          notification-keycloak:
            token-uri: http://keycloak:8180/realms/cinema/protocol/openid-connect/token

  # Mail host so the JavaMailSender bean wires up; nothing is sent.
  mail:
    host: localhost
    port: 1025

# Eureka disabled for tests.
eureka:
  client:
    enabled: false

# Listener auto-startup disabled; tests drive the listener directly.
notification:
  amqp:
    listener:
      auto-startup: false