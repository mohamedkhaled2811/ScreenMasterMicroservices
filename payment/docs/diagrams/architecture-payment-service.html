<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment · Service Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>

  <div class="frame">
    <p class="eyebrow">Architecture · ScreenMaster Payment</p>
    <h1>What the Payment service is made of</h1>

    <svg viewBox="0 0 952 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="payment-architecture-title payment-architecture-desc">
      <title id="payment-architecture-title">Payment · Service Architecture</title>
      <desc id="payment-architecture-desc">Architecture diagram of the ScreenMaster Payment service: the user picks one of three gateways (Stripe, Paymob, Sandbox) behind a single PaymentGateway port; the gateway's webhook is the only path to PAID; the service owns one Postgres database and publishes payment-succeeded and payment-failed onto screenmaster-exchange through a transactional outbox, and consumes booking-confirmation-rejected to auto-refund — the compensating step of the booking–payment saga.</desc>
