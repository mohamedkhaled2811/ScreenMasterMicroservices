  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;

      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>

  <div class="frame">
    <p class="eyebrow">Process · ScreenMaster Payment</p>
    <h1>How Payment crosses the service boundary</h1>

    <svg viewBox="0 0 976 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="payment-integration-title payment-integration-desc">
      <title id="payment-integration-title">Payment · Cross-Service Reads</title>
      <desc id="payment-integration-desc">Process diagram of the three places Payment meets Booking: one synchronous read of GET /bookings/{id}/payability that fails closed rather than guessing an amount, the PaymentSucceeded and PaymentFailed events published outbound through a transactional outbox, and the inbound BookingConfirmationRejected event that triggers a compensating refund keyed on the event id.</desc>

        <marker id="arrow-sm" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="#4f5d75"/></marker>
        <marker id="arrow-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b3341f"/></marker>
        <marker id="arrow-evt" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a4fb8"/></marker>
      </defs>
