server:
  port: 8083

# Actuator exposure for health and resilience endpoints; tracing shares this block.
management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,bulkheads,retries,metrics
  # 100% trace sampling for local runs; endpoint overridden by Compose via ZIPKIN_ENDPOINT.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

spring:
  application:
    name: payment

  # The Resilience4j starter's version verifier is excluded; the remaining auto-configuration
  # still provides the registries, property binding, and actuator endpoints.
  autoconfigure:
    exclude: io.github.resilience4j.springboot3.verifier.autoconfigure.SpringBoot3VerifierAutoConfiguration

  # Own payment-db; credentials from env vars with local-dev defaults.
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${PAYMENT_DB_USER:postgres}
    password: ${PAYMENT_DB_PASSWORD:postgres}

  # Liquibase owns the schema; Hibernate only validates entities against it.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false   # no lazy loading in the view layer; keep the tx boundary in the service

  # RabbitMQ; host overridden by Compose.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # OAuth2 resource server; one issuer URI feeds both the iss check and the JWKS URL.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/cinema}

# Eureka client registration.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

payment:
  # Public base URL for gateway redirects and webhooks; gateways cannot reach localhost, so use a tunnel locally.
  public-url: ${PAYMENT_PUBLIC_URL:http://localhost:8080}

  # Kill-switch for the background recovery jobs; off in tests so ticks never race assertions.
  sweeps:
    enabled: ${PAYMENT_SWEEPS_ENABLED:true}

  # Transactional-outbox relay cadence and per-tick batch size.
  outbox:
    relay-interval-millis: ${PAYMENT_OUTBOX_RELAY_INTERVAL_MILLIS:2000}
    relay-batch-size: ${PAYMENT_OUTBOX_RELAY_BATCH_SIZE:50}

  # Attempt-expiry sweeper cadence; expiring only closes a dead checkout, never the payment.
  expiry:
    sweep-interval-millis: ${PAYMENT_EXPIRY_SWEEP_INTERVAL_MILLIS:60000}

  # Stale threshold shared by both sweeps: younger PENDING attempts are left for reconciliation.
  reconciliation:
    stale-after: ${PAYMENT_RECONCILIATION_STALE_AFTER:PT10M}
    # Reconciliation sweep cadence and per-sweep batch size.
    sweep-interval-millis: ${PAYMENT_RECONCILIATION_SWEEP_INTERVAL_MILLIS:300000}
    batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:100}

  # Provisional deadline for session-less attempts; longer than stale-after by design.
  attempt:
    stranded-ttl: ${PAYMENT_ATTEMPT_STRANDED_TTL:PT15M}

  gateway:
    # ---------------------------------------------------------------------------------------------
    # SANDBOX — always registered (no external credentials); failure knobs drive outage simulations.
    # ---------------------------------------------------------------------------------------------
    sandbox:
      supported-currencies: ${PAYMENT_SANDBOX_CURRENCIES:EGP,USD}
      failure-rate: ${PAYMENT_SANDBOX_FAILURE_RATE:0.0}          # 0.0 = every checkout succeeds
      unavailable-rate: ${PAYMENT_SANDBOX_UNAVAILABLE_RATE:0.0}  # simulated outages for the breaker
      latency-millis: ${PAYMENT_SANDBOX_LATENCY_MILLIS:300}
      session-ttl: ${PAYMENT_SANDBOX_SESSION_TTL:PT10M}
      checkout-base-url: ${PAYMENT_SANDBOX_CHECKOUT_URL:http://localhost:8080/api/payments/sandbox/checkout}
      webhook-secret: ${PAYMENT_SANDBOX_WEBHOOK_SECRET:sandbox-local-development-secret}

    # ---------------------------------------------------------------------------------------------
    # STRIPE — test mode; absent without a secret key, live keys rejected unless allowed.
    # ---------------------------------------------------------------------------------------------
    stripe:
      # Blank counts as absent for the credentials condition.
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
      supported-currencies: ${STRIPE_CURRENCIES:USD}
      session-ttl: ${STRIPE_SESSION_TTL:PT30M}
      signature-tolerance-seconds: ${STRIPE_SIGNATURE_TOLERANCE:300}
      allow-live-key: ${STRIPE_ALLOW_LIVE_KEY:false}

    # ---------------------------------------------------------------------------------------------
    # PAYMOB — sandbox; absent without an API key.
    # ---------------------------------------------------------------------------------------------
    paymob:
      # Blank counts as absent for the credentials condition.
      api-key: ${PAYMOB_API_KEY:}
      hmac-secret: ${PAYMOB_HMAC_SECRET:}
      integration-id: ${PAYMOB_INTEGRATION_ID:}
      iframe-id: ${PAYMOB_IFRAME_ID:}
      api-base-url: ${PAYMOB_API_BASE_URL:https://accept.paymob.com}
      iframe-base-url: ${PAYMOB_IFRAME_BASE_URL:https://accept.paymob.com/api/acceptance/iframes}
      supported-currencies: ${PAYMOB_CURRENCIES:EGP}
      session-ttl: ${PAYMOB_SESSION_TTL:PT15M}

# Resilience4j policies: per-gateway breaker, bulkhead and retry, applied by ResilientPaymentGateway.
# ---------------------------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    configs:
      default:
        # Sliding-window size for the failure-rate calculation.
        sliding-window-size: ${PAYMENT_CIRCUIT_BREAKER_SLIDING_WINDOW:10}
        failure-rate-threshold: ${PAYMENT_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:50}
        # Open-state wait before half-open probes.
        wait-duration-in-open-state: ${PAYMENT_CIRCUIT_BREAKER_WAIT_OPEN:30s}
        # Probe calls allowed while half-open.
        permitted-number-of-calls-in-half-open-state: ${PAYMENT_CIRCUIT_BREAKER_HALF_OPEN_CALLS:3}
        # Only infrastructural failures count; business declines return through the normal path.
        record-exceptions:
          - com.gr74.payment.gateway.GatewayException
    instances:
      stripe:
        base-config: default
      paymob:
        base-config: default
      sandbox:
        base-config: default
  bulkhead:
    configs:
      default:
        # Per-gateway concurrency cap; rejects immediately instead of queueing (max-wait-duration 0).
        max-concurrent-calls: ${PAYMENT_BULKHEAD_MAX_CONCURRENT_CALLS:8}
        max-wait-duration: 0
    instances:
      stripe:
        base-config: default
      paymob:
        base-config: default
      sandbox:
        base-config: default
  retry:
    configs:
      default:
        # Retries for idempotent gateway calls, with exponential backoff and jitter.
        max-attempts: ${PAYMENT_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${PAYMENT_RETRY_WAIT_DURATION:200ms}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: ${PAYMENT_RETRY_BACKOFF_MULTIPLIER:2}
        enable-randomized-wait: true
        randomized-wait-factor: ${PAYMENT_RETRY_JITTER_FACTOR:0.5}
        # retry-exceptions is the retry's key (not the breaker's); open breakers are not retried.
        retry-exceptions:
          - com.gr74.payment.gateway.GatewayException
    instances:
      stripe:
        base-config: default
      paymob:
        base-config: default
      sandbox:
        base-config: default

# OpenAPI spec at /v3/api-docs, UI at /swagger-ui.html; gateway aggregates all specs.
# OpenAPI 3.1; public URL externalised so Compose can override the public host.
springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
openapi:
  public-url: ${OPENAPI_PUBLIC_URL:http://localhost:8080}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
