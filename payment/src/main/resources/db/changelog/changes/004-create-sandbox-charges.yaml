# Changeset 004 — the sandbox gateway's own ledger (BUILD_PLAN Phase 3.2).
#
# sandbox_charges is the fake third party's memory: the outcome drawn ONCE at pay time, which
# fetchStatus answers from then on (or PENDING when the user never paid). Without it a restart
# would forget who paid — and reconciliation would have nothing honest to ask.
#
# This table is deliberately NOT part of Payment's domain: it is the sandbox gateway's store that
# merely happens to live in payment-db for this lab. Payment domain code never reads it — only the
# sandbox gateway (fetchStatus) and its checkout controller (recording the drawn outcome) touch it.
databaseChangeLog:
  - changeSet:
      id: 004-1-create-sandbox-charges
      author: mohamed
      changes:
        - createTable:
            tableName: sandbox_charges
            remarks: The sandbox gateway's own ledger. Third-party state, parked here for the lab.
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: session_id
                  type: VARCHAR(255)
                  remarks: The checkout session this outcome belongs to — the lookup key.
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_sandbox_charges_session_id
              - column:
                  name: gateway_payment_id
                  type: VARCHAR(255)
                  remarks: The sandbox's own payment id, minted at pay time.
              - column:
                  name: outcome
                  type: VARCHAR(24)
                  remarks: SUCCEEDED | FAILED — drawn once at pay time, never re-drawn.
                  constraints: { nullable: false }
              - column:
                  name: failure_reason
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_sandbox_charges_gateway_payment_id
            tableName: sandbox_charges
            columns:
              - column: { name: gateway_payment_id }
