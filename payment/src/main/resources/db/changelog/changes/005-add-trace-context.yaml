# Changeset 005 — persist trace context on the outbox rows AND the webhook evidence store.
#
# Two different jobs:
#
# 1) outbox.trace_id + span_id — the async relay publishes on a @Scheduled thread, seconds after
#    the request that wrote the row committed and ended. Micrometer can only propagate a trace that
#    is LIVE on the publishing thread — and there it is not — so auto-instrumentation would end the
#    trace at the outbox row. Same principle the outbox itself runs on: if a fact must survive a
#    commit boundary, write it to the database. Captured at write time inside the business
#    transaction (the webhook span is live there), read back by the relay, stamped on the AMQP
#    message as a W3C `traceparent` header.
#
# 2) webhook_events.trace_id — a Stripe/Paymob webhook arrives with NO traceparent and starts a
#    NEW trace by design. Storing the trace id on the evidence row is what lets an
#    operator take any stored payload ("the customer says I paid and nothing happened") and open the
#    exact trace of what that webhook did.
#
# Design notes (mirrors booking's 011-add-outbox-trace-context.yaml — same deliberate duplication
# as the pattern itself):
# - All columns are NULLABLE: rows written before this changeset carry no trace, and a trace is not
#   required for delivery — a row without one publishes/stores without a trace, exactly as before.
# - VARCHAR(32)/VARCHAR(16) match the W3C traceparent fixed widths; the values are Micrometer-
#   generated hex, so the widths are exact and never padded.
# - span_id becomes the traceparent's PARENT span id on the wire, so the consumer's restored span
#   is a child of the span that caused the event — a true causal chain across the hop.
databaseChangeLog:
  - changeSet:
      id: 005-1-add-trace-context
      author: mohamed
      changes:
        - addColumn:
            tableName: outbox
            columns:
              - column:
                  name: trace_id
                  type: VARCHAR(32)
                  remarks: The 32-hex W3C trace id active when the row was written (null when none was).
              - column:
                  name: span_id
                  type: VARCHAR(16)
                  remarks: The 16-hex id of the writing span - the consumer's restored span is its child.
        - addColumn:
            tableName: webhook_events
            columns:
              - column:
                  name: trace_id
                  type: VARCHAR(32)
                  remarks: The webhook's own trace id - the link from a stored payload to what it did.