# Changeset 005 — trace columns on the outbox and webhook_events tables.
# Nullable: older rows carry no trace. span_id becomes the traceparent parent id on the wire.
databaseChangeLog:
  - changeSet:
      id: 005-1-add-trace-context
      author: mohamed
      changes:
        - addColumn:
            tableName: outbox
            columns:
              - column:
                  name: trace_id
                  type: VARCHAR(32)
                  remarks: The 32-hex W3C trace id active when the row was written (null when none was).
              - column:
                  name: span_id
                  type: VARCHAR(16)
                  remarks: The 16-hex id of the writing span - the consumer's restored span is its child.
        - addColumn:
            tableName: webhook_events
            columns:
              - column:
                  name: trace_id
                  type: VARCHAR(32)
                  remarks: The webhook's own trace id - the link from a stored payload to what it did.