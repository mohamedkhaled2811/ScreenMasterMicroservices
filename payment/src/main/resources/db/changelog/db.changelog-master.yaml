# Liquibase master changelog for payment-db. Changesets apply in listed order; shipped files are immutable.
#
#   001-create-payments      payments table (superseded by 002, kept for history)
#   002-rebuild-payment-domain payments, payment_attempts, refunds, webhook_events + live-attempt index
#   003-create-outbox        transactional outbox table
#   004-create-sandbox-charges sandbox gateway ledger
#   005-add-trace-context    outbox + webhook_events trace columns
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-payments.yaml
  - include:
      file: db/changelog/changes/002-rebuild-payment-domain.yaml
  - include:
      file: db/changelog/changes/003-create-outbox.yaml
  - include:
      file: db/changelog/changes/004-create-sandbox-charges.yaml
  - include:
      file: db/changelog/changes/005-add-trace-context.yaml
