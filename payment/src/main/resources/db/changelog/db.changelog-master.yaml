# Liquibase master changelog for the payment service (payment-db).
#
# The master is an INDEX, not a place for actual DDL: it `include`s versioned changeset files in
# order, so the migration history reads top-to-bottom and new changes are appended as new files
# (never edited in place — an applied changeset is immutable, that's how Liquibase guarantees every
# environment converges on the same schema). See docs/concepts/liquibase.md.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-payments.yaml
  - include:
      file: db/changelog/changes/002-rebuild-payment-domain.yaml
  - include:
      file: db/changelog/changes/003-create-outbox.yaml
  - include:
      file: db/changelog/changes/004-create-sandbox-charges.yaml
  - include:
      file: db/changelog/changes/005-add-trace-context.yaml
