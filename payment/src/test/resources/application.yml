# Test-only config — keeps the contextLoads smoke test hermetic (no Postgres, no Eureka).
spring:
  # Same exclusion as the main application.yml: the resilience4j Boot-3 starter's verifier refuses
  # Boot 4 and would kill the context. This test file SHADOWS the main one, so it must repeat it.
  autoconfigure:
    exclude: io.github.resilience4j.springboot3.verifier.autoconfigure.SpringBoot3VerifierAutoConfiguration

# Expose the resilience endpoints so ResilienceConfigTest can prove the Boot-3 starter's actuator
# auto-configuration actually works on this Boot-4 stack (registry, binding and endpoints).
management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,bulkheads,retries,metrics
  # In-memory H2 instead of Postgres. PostgreSQL compatibility mode so the entity mappings behave
  # like production; Hibernate builds the schema (create-drop) for the test run.
  datasource:
    url: jdbc:h2:mem:payment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  # Liquibase changesets are Postgres-flavoured; let Hibernate own the test schema instead.
  liquibase:
    enabled: false

# Don't try to reach a Eureka server during tests.
eureka:
  client:
    enabled: false

# Gateway config for tests. Stripe/Paymob credentials are deliberately ABSENT so their adapters are
# conditioned out of the context — the hermetic suite must never be able to reach a real gateway.
# SANDBOX is always registered (no external credentials), which is what the tests exercise.
payment:
  public-url: http://localhost:8080
  # The relay tick is silenced in tests (it would fire every 2s against H2, whose dialect lacks
  # SKIP LOCKED): WebhookProcessorTest proves the row shares the business write's fate, and
  # OutboxRelayTest drives drain() directly against a mocked claim.
  outbox:
    relay-interval-millis: 3600000
    relay-batch-size: 50
  # The sweeps never fire mid-suite (a long interval alone would NOT suffice: a @Scheduled
  # fixedDelay bean still fires its first tick per context, which raced frozen-clock fixtures —
  # so the kill-switch stays off here and every sweep is driven directly in its test).
  sweeps:
    enabled: false
  expiry:
    sweep-interval-millis: 3600000
  reconciliation:
    sweep-interval-millis: 3600000
    batch-size: 100
    stale-after: PT10M
  # No broker in the hermetic suite: the @RabbitListener containers stay stopped
  # (BookingConfirmationRejectedListener is driven directly in RefundServiceTest).
  amqp:
    listener:
      auto-startup: false
  gateway:
    sandbox:
      supported-currencies: EGP,USD
      failure-rate: 0.0
      unavailable-rate: 0.0
      latency-millis: 0        # no artificial sleep in tests
      session-ttl: PT10M
      checkout-base-url: http://localhost:8080/api/payments/sandbox/checkout
      webhook-secret: test-webhook-secret
