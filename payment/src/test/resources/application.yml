# Test-only config — keeps the contextLoads smoke test hermetic (no Postgres, no Eureka).
spring:
  # In-memory H2 instead of Postgres. PostgreSQL compatibility mode so the entity mappings behave
  # like production; Hibernate builds the schema (create-drop) for the test run.
  datasource:
    url: jdbc:h2:mem:payment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  # Liquibase changesets are Postgres-flavoured; let Hibernate own the test schema instead.
  liquibase:
    enabled: false

# Don't try to reach a Eureka server during tests.
eureka:
  client:
    enabled: false

# Gateway config for tests. Stripe/Paymob credentials are deliberately ABSENT so their adapters are
# conditioned out of the context — the hermetic suite must never be able to reach a real gateway.
# SANDBOX is always registered (no external credentials), which is what the tests exercise.
payment:
  public-url: http://localhost:8080
  gateway:
    sandbox:
      supported-currencies: EGP,USD
      failure-rate: 0.0
      unavailable-rate: 0.0
      latency-millis: 0        # no artificial sleep in tests
      session-ttl: PT10M
      checkout-base-url: http://localhost:8080/api/payments/sandbox/checkout
      webhook-secret: test-webhook-secret
