# Test-only config: no Postgres, no Eureka.
spring:
  # Same autoconfigure exclusion as the main file; this file shadows it, so it repeats it.
  autoconfigure:
    exclude: io.github.resilience4j.springboot3.verifier.autoconfigure.SpringBoot3VerifierAutoConfiguration
  # Resource-server issuer URI repeated here; no network at boot.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8180/realms/cinema

# Expose the resilience endpoints for the actuator tests.
management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,bulkheads,retries,metrics
  # In-memory H2 in PostgreSQL mode; Hibernate builds the test schema.
  datasource:
    url: jdbc:h2:mem:payment;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  # Hibernate owns the test schema; Liquibase stays off.
  liquibase:
    enabled: false

# No Eureka server in tests.
eureka:
  client:
    enabled: false

# Gateway credentials stay absent so only the sandbox registers.
payment:
  public-url: http://localhost:8080
  # Relay tick silenced; OutboxRelayTest drives drain() directly.
  outbox:
    relay-interval-millis: 3600000
    relay-batch-size: 50
  # Sweeps stay off; each sweep is driven directly in its test.
  sweeps:
    enabled: false
  expiry:
    sweep-interval-millis: 3600000
  reconciliation:
    sweep-interval-millis: 3600000
    batch-size: 100
    stale-after: PT10M
  # No broker in tests; listener containers stay stopped.
  amqp:
    listener:
      auto-startup: false
  gateway:
    sandbox:
      supported-currencies: EGP,USD
      failure-rate: 0.0
      unavailable-rate: 0.0
      latency-millis: 0        # no artificial sleep in tests
      session-ttl: PT10M
      checkout-base-url: http://localhost:8080/api/payments/sandbox/checkout
      webhook-secret: test-webhook-secret
